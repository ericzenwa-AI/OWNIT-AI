<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ownIT</title>
<!-- Typesetting only. If either of these fails to load, mathHtml() falls back
     to the plain text the bank stores, which is what the page showed before. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      crossorigin="anonymous">
<script defer
        src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
        crossorigin="anonymous"></script>
<style>
  /* ------------------------------------------------------------------
     The same two colour systems as the landing page, and the same rule
     about which is which.

     One accent, spent only on things you can act on: the Start button,
     an option under the cursor, a focus ring.

     Green and rust are not decoration here - they are the answer. Green
     is a skill that held, rust is where it broke. The accent never
     appears on a verdict, and a verdict colour never appears on a
     control.
     ------------------------------------------------------------------ */
  :root {
    --bg:      #FAFAFB;
    --card:    #FFFFFF;
    --sunk:    #F4F5F7;
    --ink:     #0E1013;
    --muted:   #464C5A;
    --faint:   #666C7A;
    --line:    #E9EAEE;
    --accent:  #4F46E5;
    --on-accent: #FFFFFF;

    --held:    #2F5D50;
    --broke:   #8C3B2E;

    --lift: 0 1px 2px rgba(14, 16, 19, 0.04),
            0 8px 24px -6px rgba(14, 16, 19, 0.08);

    --sans: "Outfit", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:     #0A0B0E;
      --card:   #131519;
      --sunk:   #0F1114;
      --ink:    #F1F2F5;
      --muted:  #A2A8B4;
      --faint:  #6F7583;
      --line:   #23262D;
      --accent: #8B84F5;
      --on-accent: #0A0B0E;
      --held:   #7FB9A5;
      --broke:  #E08A72;
      --lift: none;
    }
  }

  :root[data-theme="dark"] {
    --bg:     #0A0B0E;
    --card:   #131519;
    --sunk:   #0F1114;
    --ink:    #F1F2F5;
    --muted:  #A2A8B4;
    --faint:  #6F7583;
    --line:   #23262D;
    --accent: #8B84F5;
    --on-accent: #0A0B0E;
    --held:   #7FB9A5;
    --broke:  #E08A72;
    --lift: none;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2.5rem 1.25rem 5rem;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 36rem; margin: 0 auto; }

  h1 {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 0.4rem;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
  }
  h1::before {
    content: "";
    width: 0.6rem; height: 0.6rem;
    border-radius: 3px;
    background: var(--accent);
  }
  .sub { color: var(--muted); font-size: 1rem; margin: 0 0 2.5rem; }

  /* ---- what you fill in ---- */

  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--ink);
    /* The three things being asked for are three separate questions, and
       ran together as one block of form. This is most of the gap. */
    margin: 2.25rem 0 0.6rem;
  }
  .card > label:first-child { margin-top: 0; }

  textarea, input[type=text] {
    width: 100%;
    padding: 0.9rem 1rem;
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  ::placeholder { color: var(--faint); }

  /* The default control is a grey system button and the word "unstyled".
     ::file-selector-button reaches it without changing the markup. */
  input[type=file] {
    width: 100%;
    font-family: var(--sans);
    font-size: 0.92rem;
    color: var(--muted);
    background: var(--bg);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 0.85rem 1rem;
    cursor: pointer;
  }
  input[type=file]::file-selector-button {
    font-family: var(--sans);
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.5rem 0.9rem;
    margin-right: 0.9rem;
    cursor: pointer;
  }
  input[type=file]:hover { border-color: var(--accent); }
  input[type=file]::file-selector-button:hover { border-color: var(--accent); }

  /* ---- things you press ---- */

  button {
    font-family: var(--sans);
    font-size: 1.0625rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    padding: 0.9rem 1.5rem;
    border-radius: 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--on-accent);
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #go { width: 100%; margin-top: 2rem; }

  button.option {
    display: block; width: 100%; text-align: left;
    margin: 0.6rem 0;
    font-size: 1rem;
    font-weight: 400;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  button.option:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--sunk);
    transform: none;
    filter: none;
  }
  button.option .letter {
    color: var(--faint);
    font-weight: 600;
    font-size: 0.85rem;
    margin-right: 0.8rem;
  }

  /* ---- the blocks ---- */

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 2rem 1.75rem;
    margin: 1.25rem 0;
    box-shadow: var(--lift);
  }

  /* Small, spaced and quiet: a card says what it is before it says
     anything else. The same treatment as the landing page's eyebrows. */
  .skill, .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 0.9rem;
  }
  .label { color: var(--accent); }

  .question {
    font-size: 1.15rem;
    line-height: 1.6;
    margin-bottom: 1.5rem;
    white-space: pre-wrap;
  }

  /* The one statement on this page, so it gets the room a statement gets. */
  .gap {
    font-size: clamp(1.7rem, 6vw, 2.2rem);
    line-height: 1.15;
    letter-spacing: -0.035em;
    color: var(--held);
    font-weight: 700;
    margin: 0 0 1.1rem;
    text-wrap: balance;
  }

  /* The one instruction on the page. Sits directly under the gap it is
     about, and is the thing a student is meant to leave with, so it gets
     body size rather than the quieter note size used for asides. */
  .practice {
    font-size: 1.05rem;
    line-height: 1.65;
    margin: 0 0 1.1rem;
    padding-left: 0.9rem;
    border-left: 2px solid var(--held);
  }

  /* Context, not the task. Sits above the question box and must not compete
     with it for attention. */
  .card.scope { background: var(--sunk); box-shadow: none; padding: 1.4rem 1.5rem; }
  .card.scope p { font-size: 0.95rem; }
  .card.scope .note { margin-top: 0.7rem; }

  .chain { color: var(--muted); font-size: 0.95rem; margin-top: 0.4rem; }
  .note { color: var(--muted); font-size: 0.95rem; }
  p { margin: 0 0 1rem; }
  p:last-child { margin-bottom: 0; }

  /* A tick or a cross, not our internal words for it. */
  .held::before { content: "\2713\00a0\00a0"; color: var(--held); }
  .missed::before { content: "\2717\00a0\00a0"; color: var(--broke); }
  ul { padding-left: 1.2rem; }
  li { margin: 0.5rem 0; }

  details summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.92rem;
    font-weight: 500;
  }
  details[open] summary { margin-bottom: 1rem; }
  strong { color: var(--ink); font-weight: 600; }

  .quiet-link {
    background: none; border: none; color: var(--muted);
    text-decoration: underline; padding: 0;
    font-size: 0.9rem; font-weight: 400;
  }
  .quiet-link:hover { transform: none; filter: none; color: var(--accent); }

  .error { color: var(--broke); }

  /* Quieter than a question card - it is a note about the question, not part
     of the diagnosis. */
  .card.parts { padding: 1rem 1.25rem; background: var(--sunk); box-shadow: none; }
  .card.parts .note { margin: 0; }
  button.quiet-link.part {
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    margin: 0 0.15rem;
  }
  button.quiet-link.part:hover { filter: none; transform: none; opacity: 0.75; }

  /* The chooser. Each part reads as a line of the question rather than a
     control, because that is what someone is scanning for. */
  .choices { margin-top: 1rem; }
  .choices .option {
    font-size: 1rem;
    line-height: 1.6;
    padding: 1rem 1.1rem;
    margin: 0.6rem 0;
  }
  .choices .letter { font-weight: 700; color: var(--accent); }
  /* A part we cannot reach is shown rather than hidden - knowing it was read
     and cannot be helped with is worth more than it quietly missing. */
  .option.dead {
    display: block;
    border: 1px dashed var(--line);
    border-radius: 12px;
    background: var(--sunk);
    color: var(--faint);
  }
  .option.dead .letter { color: var(--faint); }
  .option.dead .note { font-size: inherit; }

  /* Quieter than a question card - it is the working, not the question. */
  /* Two words and two buttons. Anything bigger and it reads as a form to fill
     in rather than a question to answer on the way past. */
  .card.useful { padding: 1.25rem 1.5rem; background: var(--sunk); box-shadow: none; }
  .card.useful .note { margin: 0 0 0.5rem; }
  button.plain {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    font-size: 0.95rem;
    padding: 0.6rem 1.1rem;
    margin-right: 0.5rem;
  }
  button.plain:hover:not(:disabled) {
    border-color: var(--accent);
    filter: none;
    transform: none;
  }

  /* Numbered, because the order is the point - each one is only reachable
     once the one before it holds. */
  ol.upwards {
    margin: 1rem 0 0;
    padding-left: 0;
    list-style: none;
    counter-reset: step;
  }
  /* The number is taken out of the flow rather than given a grid column.
     As a grid, the skill name and the note after it were two separate items,
     so the note wrapped onto the next row - into the column sized for a
     number - and came out one word per line down the side of the card. Any
     second element inside the item would have done the same. */
  ol.upwards li {
    counter-increment: step;
    position: relative;
    padding: 0.7rem 0 0.7rem 2.8rem;
    border-top: 1px solid var(--line);
    line-height: 1.55;
  }
  ol.upwards li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 0.75rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--on-accent);
    background: var(--accent);
    border-radius: 7px;
    width: 1.9rem; height: 1.9rem;
    display: grid; place-items: center;
  }
  /* Sits with the line it belongs to, not under it. */
  ol.upwards .note { white-space: normal; }

  .card.descent {
    padding: 1.25rem 1.5rem;
    background: var(--sunk);
    box-shadow: none;
  }
  .card.descent ul { margin: 0; padding-left: 0; list-style: none; }
  .card.descent li {
    font-size: 0.95rem;
    margin: 0.35rem 0;
    color: var(--muted);
  }
  /* Each answer sits one step further in than the last, because that is what
     the walk is doing - going down, not along. */
  .card.descent li + li { padding-left: 0.9rem; }
  .card.descent li + li + li { padding-left: 1.8rem; }
  .card.descent li + li + li + li { padding-left: 2.7rem; }
  .card.descent li + li + li + li + li { padding-left: 3.6rem; }
  /* Said they did not know: not a mistake, and not a pass either. */
  .unsure::before { content: "?\00a0\00a0"; color: var(--faint); }

  /* Sits a touch up on Outfit, which has a taller x-height than the serif
     this used to be set in. For the notation only. */
  .katex { font-size: 1.05em; }
  /* A long quotient must not push the card sideways on a phone. */
  .question, button.option { overflow-x: auto; }

  .counter {
    color: var(--faint); font-size: 0.8rem; text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* The verdict card: two buttons side by side rather than stacked full width. */
  #verdict button { width: auto; margin-top: 0.5rem; margin-right: 0.5rem; }
  #verdict #send-verdict { margin-top: 1.25rem; }

  @media (max-width: 34rem) {
    .card { padding: 1.5rem 1.25rem; border-radius: 16px; }
    label { margin-top: 1.75rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1>ownIT</h1>
  <p class="sub">Stuck on a maths question? Let's find what's actually missing.</p>
  <div id="screen"></div>
</main>

<script>
const screen = document.getElementById('screen');
let state = {};

// The lettered parts of the question, kept here rather than sent back and
// forth. Switching part starts a fresh walk, and the reply to that only knows
// about the part it was asked for - this is what remembers the rest.
let parts = null;
// What was typed or photographed, so a switch does not need it again.
let asked = null;

// The session id goes in the address bar, so the page a student is looking at
// is a page they can bookmark, and a link a tutor can send them back to. It is
// replaceState rather than pushState: every question is the same session, and
// the back button should leave the diagnostic rather than undo a question.
function rememberSession(id) {
  if (!id) return;
  // Keep whatever else was on the link. Writing '?s=42' wholesale dropped
  // ?tutor=1 off the address on the very first question, so a link that had
  // been opened as a tutor stopped looking like one the moment it was used.
  const params = new URLSearchParams(location.search);
  params.set('s', id);
  history.replaceState(null, '', '?' + params.toString());
}

function forgetSession() {
  history.replaceState(null, '', location.pathname);
}

function sessionInUrl() {
  const id = new URLSearchParams(location.search).get('s');
  return id && /^\d+$/.test(id) ? id : null;
}

// Only a tutor should be judging a diagnosis. There is no sign-in yet, so this
// is a flag on the link rather than an account - enough to keep it away from
// students without pretending to be security.
//
// It sticks once set, because the flag was on the link and nowhere else: a
// tutor had to remember to type it every time, and every session they forgot
// was a verdict nobody recorded. ?tutor=0 turns it off again, which matters on
// a laptop a student also uses.
function isTutor() {
  const asked = new URLSearchParams(location.search).get('tutor');
  if (asked !== null) {
    const on = asked !== '0' && asked !== 'no';
    remember('ownit.tutor', on ? '1' : '');
    return on;
  }
  return recall('ownit.tutor') === '1';
}

// Storage throws rather than returning null in some private modes, so both of
// these have to be able to fail without taking the page down with them.
function remember(key, value) {
  try { localStorage.setItem(key, value); } catch (error) { /* not available */ }
}

function recall(key) {
  try { return localStorage.getItem(key); } catch (error) { return null; }
}

// A photo keeps the layout that copy-pasting destroys - powers and fractions
// come out of a PDF as loose numbers - so it is offered first.
// What is covered, and what is not, before a single keystroke.
//
// This page said nothing about scope. A tutor brought a trigonometry question,
// typed it out or photographed it, waited for it to be read, and only then
// found out - which is the worst possible moment to learn it and the likeliest
// reason someone never comes back.
//
// The list is read off the graph rather than written here, because a hardcoded
// one drifts and the failure it drifts into is telling a tutor that a topic is
// covered when it is not. The hardcoded copy below is the fallback for when
// that request does not answer; being a little out of date beats being silent.
const COVERED_FALLBACK =
  'differentiation, integration, indices and surds, quadratics, sequences ' +
  'and series, binomial expansion, exponentials and logarithms, functions, ' +
  'coordinate geometry, polynomials, linear equations, expanding and ' +
  'factorising, ratio and proportion, and fractions, decimals and percentages';

async function showScope() {
  const into = document.getElementById('covers');
  if (!into) return;
  try {
    const response = await fetch('/api/health');
    const health = await response.json();
    const topics = (health.topics || []).slice().sort();
    if (topics.length) into.textContent = listOf(topics) + '.';
  } catch (error) {
    /* the fallback is already on the page */
  }
}

function askScreen() {
  screen.innerHTML = `
    <div class="card scope">
      <p class="label">What this covers</p>
      <p>A-level Pure, and the GCSE underneath it &mdash;
        <span id="covers">${COVERED_FALLBACK}.</span></p>
      <p class="note"><strong>Not trigonometry, statistics or mechanics yet.</strong>
        If it can&rsquo;t place your question it says so rather than guessing,
        and tells me what it turned away.</p>
    </div>

    <div class="card">
      <label for="photo">A photo of the question (best)</label>
      <input type="file" id="photo" accept="image/*,application/pdf">
      <label for="text">Or type it out</label>
      <textarea id="text" placeholder="Simplify (x^5 * x^2) / x^3"></textarea>
      <label for="attempt">What you tried, if anything (optional)</label>
      <input type="file" id="working" accept="image/*,application/pdf">
      <textarea id="attempt" placeholder="Or type it out - I don't know how to start"></textarea>
      <p><button id="go">Start</button></p>
      <p id="msg" class="note"></p>
    </div>`;
  document.getElementById('go').onclick = start;
  showScope();
}

async function start() {
  const button = document.getElementById('go');
  const msg = document.getElementById('msg');
  const file = document.getElementById('photo').files[0];
  const text = document.getElementById('text').value.trim();

  if (!file && !text) { msg.textContent = 'Give me the question, or a photo of it.'; return; }

  button.disabled = true;

  const working = document.getElementById('working').files[0];

  const body = {
    question: text,
    attempt: document.getElementById('attempt').value.trim() || null,
  };

  if (file || working) msg.textContent = 'Getting the photo ready...';

  if (file) {
    const ready = await readyToSend(file);
    body.attachment = await asBase64(ready);
    body.attachment_type = ready.type;
  }
  // A photo of the working is read the same way the question is, and for the
  // same reason: it is done on paper, and typing it out loses the notation.
  if (working) {
    const ready = await readyToSend(working);
    body.attempt_attachment = await asBase64(ready);
    body.attempt_attachment_type = ready.type;
  }

  msg.textContent = working
    ? 'Reading the question and your working...'
    : 'Reading the question...';

  try {
    state = await post('/api/start', body);
    asked = body;
    parts = state.parts || null;
    // A multi-part question comes back with no session: nothing is walked
    // until a part is chosen, so there is nothing to remember yet.
    if (state.session_id) rememberSession(state.session_id);
    draw();
  } catch (error) {
    button.disabled = false;
    msg.className = 'error';
    msg.textContent = error.message;
  }
}

// Someone who sends a whole exam question is rarely stuck on part (a) - that
// is usually the one they could do. Switching starts a new walk on the part
// they choose, using the skill we worked out when the question was first read,
// so it costs nothing to change your mind.
async function switchTo(label) {
  const part = (parts || []).find(p => p.label === label);
  if (!part || !part.covered || part.current) return;

  screen.innerHTML = '<div class="card"><p class="note">Starting on part (' +
    escape(label) + ')...</p></div>';


  try {
    state = await post('/api/start', {
      question: asked ? asked.question : '',
      attempt: asked ? asked.attempt : null,
      start_at: part.skill_id,
      start_summary: part.summary,
    });
    parts = (parts || []).map(p => Object.assign({}, p, {current: p.label === label}));
    rememberSession(state.session_id);
    draw();
  } catch (error) {
    screen.innerHTML = `<div class="card"><p class="error">${escape(error.message)}</p></div>
      <p><button onclick="newQuestion()">Start again</button></p>`;
  }
}

// Reads as a sentence rather than a row of buttons, because it is telling
// someone something they did not know - that the rest of their question was
// read - as much as it is offering them a control.
function partsBar() {
  if (!parts || parts.length < 2) return '';

  const here = parts.find(p => p.current);
  if (!here) return '';
  const others = parts.filter(p => !p.current);
  const offer = others.filter(p => p.covered);
  const cannot = others.filter(p => !p.covered);

  const links = offer.map(p =>
    `<button class="quiet-link part" data-part="${escape(p.label)}"
             title="${escape(p.summary)}">(${escape(p.label)})</button>`).join(' ');

  const missing = cannot.length
    ? ` I can't help with ${listOf(cannot.map(p => '(' + escape(p.label) + ')'))} yet.`
    : '';

  return `<div class="card parts">
    <p class="note">This question has ${parts.length} parts. Working on
    <strong>(${escape(here ? here.label : 'a')})</strong>.${
      offer.length ? ` Stuck on a different one? ${links}` : ''}${missing}</p>
  </div>`;
}

function wireParts() {
  document.querySelectorAll('button.part').forEach(b => {
    b.onclick = () => switchTo(b.dataset.part);
  });
}

async function answer(label) {
  document.querySelectorAll('button.option').forEach(b => b.disabled = true);
  try {
    state = await post('/api/answer', {
      session_id: state.session_id,
      label,
      answered_before: state.asked_so_far,
    });
    rememberSession(state.session_id);
    draw();
  } catch (error) {
    screen.insertAdjacentHTML('beforeend', `<p class="error">${error.message}</p>`);
  }
}

// Following a link to a walk already in progress. The question comes back in
// the order it was shown, so the letters mean what they meant yesterday.
async function resume(id) {
  screen.innerHTML = '<div class="card"><p class="note">Finding where you left off...</p></div>';
  try {
    state = await get('/api/session/' + id);
    draw();
  } catch (error) {
    forgetSession();
    screen.innerHTML = `<div class="card">
      <p class="error">${escape(error.message)}</p>
      <p class="note">That link may be from a walk that was never finished, or from
      a different device.</p>
    </div>
    <p><button onclick="newQuestion()">Start a new question</button></p>`;
  }
}

// Running the same question again, after working on what was in the way.
//
// Not a memory of what was found last time: a new session, walked from the top.
// That is the only way to find out whether the thing that gave way still does,
// and it is what makes the answer meaningful - if the gap holds now, the walk
// carries straight past it and names whatever is behind it instead.
//
// The doorway is reused rather than re-read. Same question, same place to start,
// and nothing is paid to work that out twice.
//
// The old attempt is deliberately dropped. It was the working from before they
// practised, and feeding it back in would narrow the new walk with stale
// evidence about a student who has since changed.
async function retake() {
  const r = state.report || {};
  if (!r.entry_skill_id) return;

  // The original question is sent when the page still has it, and simply left
  // out when it does not. Starting at a known skill returns before /api/start
  // checks for a question at all, and the walk asks banked questions about
  // skills rather than anything about the original - so there is nothing to
  // resubmit. This used to refuse without it, which turned a photo question
  // reloaded from a link into a dead end, and photographing the question is
  // what most students actually do.
  const body = asked ? Object.assign({}, asked)
             : (r.question ? {question: r.question} : {});

  body.start_at = r.entry_skill_id;
  body.start_summary = r.presentation_note || '';
  delete body.attempt;
  delete body.attempt_attachment;
  delete body.attempt_attachment_type;

  screen.innerHTML = `<div class="card"><p class="note">Starting this question
    again, from the top&hellip;</p></div>`;

  // Starting at a known skill skips the read, and the read is what returns the
  // lettered parts. Without keeping them, retaking part (b) would silently lose
  // the way back to (a) and (c).
  const hadParts = parts;

  try {
    state = await post('/api/start', body);
    parts = state.parts || hadParts;
    if (state.session_id) rememberSession(state.session_id);
    draw();
  } catch (error) {
    screen.innerHTML = `<div class="card"><p class="error">${escape(error.message)}</p></div>
      <p><button onclick="newQuestion()">Start again</button></p>`;
  }
}

// Whether the question can be run again. Only the doorway is needed: the walk
// asks about skills, not about the question, so a photo that was never stored
// and a page that has been reloaded both retake perfectly well.
function canRetake() {
  return Boolean((state.report || {}).entry_skill_id);
}

// The closing ladder: four questions from the gap up to their own problem.
//
// Offered rather than run automatically, because it is the only thing on this
// page that spends money at a student's choosing. Which also makes the click
// worth counting - how many people, having been told what is in the way, want
// walking back up to their own question.
let climb = null;

async function startClimb() {
  const said = document.getElementById('climb-said');
  const button = document.querySelector('#climb button');
  if (button) button.disabled = true;
  if (said) said.textContent = 'Writing four questions for yours...';

  try {
    const got = await post('/api/ladder', {session_id: state.session_id});
    climb = {rung: got.rung, missed: []};
    drawRung();
  } catch (error) {
    if (button) button.disabled = false;
    if (said) { said.className = 'error'; said.textContent = error.message; }
  }
}

function drawRung() {
  const rung = climb.rung;
  const options = rung.options.map(o =>
    `<li><button class="option" onclick="answerRung('${escape(o.label)}')">
       ${mathHtml(o.text)}</button></li>`).join('');

  // The last rung is their own question. When it came from a photo it is the
  // reading of it rather than their words, and saying so is the difference
  // between a paraphrase and a misquote.
  const heading = rung.is_final
    ? `<p class="label">Your question${rung.verbatim ? '' : ', as we read it'}</p>`
    : `<p class="label">Step ${rung.position} of ${rung.of}</p>`;

  screen.innerHTML = `
    <div class="card">
      ${heading}
      <p class="question">${mathHtml(rung.question)}</p>
      <ul class="options">${options}</ul>
    </div>`;
}

async function answerRung(label) {
  const at = climb.rung.position;
  document.querySelectorAll('.option').forEach(b => b.disabled = true);

  try {
    const got = await post('/api/ladder/answer', {
      session_id: state.session_id, position: at, label: label});

    if (!got.right) climb.missed.push({at: at, mistake: got.mistake});

    if (got.rung) {
      climb.rung = got.rung;
      drawRung();
      return;
    }
    climbDone(got);
  } catch (error) {
    screen.innerHTML = `<div class="card"><p class="error">${escape(error.message)}</p></div>
      <p><button onclick="report()">Back to the report</button></p>`;
  }
}

function climbDone(got) {
  // Three endings, and the middle one is the one that had to be got right: they
  // cleared every step and then the whole thing did not come out. That is not a
  // gap - the walk already found and cleared that - it is the pieces being there
  // and the assembly not, and telling them they still have a gap would
  // contradict the evidence they have just produced.
  const card = got.right
    ? `<p class="label">That&rsquo;s the one</p>
       <p>You built it up a step at a time and got your own question out at the
       end. That is the thing that was in the way, cleared.</p>`
    : got.climbed
      ? `<p class="label">Not yet &mdash; and that&rsquo;s worth knowing</p>
         <p>You got the steps and then the whole thing together didn&rsquo;t come
         out. That usually means the pieces are there and putting them together
         is the part to practise, not any one of them.</p>
         ${got.mistake ? `<p class="note">${escape(got.mistake)}</p>` : ''}`
      : `<p class="label">Worth another look</p>
         <p>A couple of the steps didn&rsquo;t come out either, so it is worth
         going back to the practice above before trying the whole thing again.</p>
         ${got.mistake ? `<p class="note">${escape(got.mistake)}</p>` : ''}`;

  screen.innerHTML = `
    <div class="card">${card}</div>
    <p><button onclick="report()">Back to the report</button></p>`;
}

function newQuestion() {
  forgetSession();
  state = {};
  parts = null;
  asked = null;
  askScreen();
}

function draw() {
  if (state.message) return outOfScope();
  if (state.parts && !state.session_id) return chooseScreen();
  if (state.finished) return report();
  question();
}

// A question with lettered parts asks which one before starting on any of
// them. Starting at (a) was starting on the part they are least likely to be
// stuck on - it is usually the one they could do - and two questions about the
// wrong part is a worse price than one tap.
function chooseScreen() {
  const rows = parts.map(part => part.covered
    ? `<button class="option part" data-part="${escape(part.label)}">
         <span class="letter">(${escape(part.label)})</span>${escape(part.summary)}
       </button>`
    : `<div class="option dead">
         <span class="letter">(${escape(part.label)})</span>${escape(part.summary)}
         <span class="note"> &mdash; not something I can help with yet.</span>
       </div>`).join('');

  screen.innerHTML = `
    <div class="card">
      <div class="skill">This question has ${parts.length} parts</div>
      <p class="note">Which one are you stuck on?</p>
      <div class="choices">${rows}</div>
    </div>`;

  wireParts();
}

// The descent as it happens, rather than only in the report at the end.
//
// This was tutor-only at first, on the grounds that a student watching a column
// of crosses build up is being told something discouraging they cannot act on
// until the end. That was the wrong call for two reasons: the person using this
// is a tutor, so the gate mostly hid it from the people it was for, and it was
// hidden behind a flag on a link that you had to already know about.
//
// It shows nothing until the first question is answered, which is correct - on
// the opening screen there is nothing to show yet.
function descent() {
  if (!state.so_far || !state.so_far.length) return '';

  const rows = state.so_far.map(a => {
    const how = a.dont_know ? 'unsure' : (a.held ? 'held' : 'missed');
    return `<li class="${how}">${escape(a.skill_name)}</li>`;
  }).join('');

  return `<div class="card descent">
    <div class="skill">Where it has got to</div>
    <ul>${rows}</ul>
  </div>`;
}

function question() {
  const q = state.asking;
  screen.innerHTML = `
    ${state.matched ? `<p class="note">Looking at: ${escape(state.matched)}</p>` : ''}
    ${partsBar()}
    <div class="card">
      <!-- Says why this is being asked without naming the chain. The chain is
           most of how you would approach their question, and announcing what
           we suspect before they answer invites them to answer to it. The
           skill's own name is our vocabulary anyway - it belongs in the
           tutor's report, not on a student's screen. -->
      <div class="skill">Something your question rests on</div>
      <div class="question">${mathHtml(q.question)}</div>
      <div id="options"></div>
    </div>
    ${descent()}
    <p class="counter">${state.asked_so_far} answered</p>`;

  const box = document.getElementById('options');
  q.options.forEach(o => {
    const button = document.createElement('button');
    button.className = 'option';
    button.innerHTML = `<span class="letter">${o.label}</span>${mathHtml(o.text)}`;
    button.onclick = () => answer(o.label);
    box.appendChild(button);
  });

  wireParts();
}

// Where this goes once the gap is cleared.
//
// The report named the gap and stopped there, which leaves a student with one
// thing to fix and no sense of what fixing it buys them. The chain has been
// computed and sent to this page the whole time - it is the route the walk took
// down - and reversed it is the order things open back up in, ending at the
// question they actually came with.
//
// This used to be kept off the student's screen, on the reasoning that "your
// A-level question failed at fraction arithmetic" is demoralising. Read
// downward it is. Read upward, which is how it is set out here, it is the way
// back to their own question - so it stays, and the wording carries it.
function wayBack(gap, stuckOn) {
  if (!gap || !gap.chain || gap.chain.length < 2) return '';

  // Stored top-down: the question first, the gap last. It opens up the other
  // way, and the gap itself is already named above.
  const upwards = gap.chain.slice().reverse().slice(1);
  if (!upwards.length) return '';

  const steps = upwards.map((skill, i) => {
    const last = i === upwards.length - 1;
    return `<li>${escape(skill)}${last
      ? ' <span class="note">&mdash; where you started</span>' : ''}</li>`;
  }).join('');

  // The one caveat left on this screen. The card listing what we did not check
  // was tutor information and read to a student as a disclaimer, but the walk
  // really does follow one trail rather than everything, and a single named
  // skill otherwise reads as the whole story.
  return `<div class="card">
    <p class="label">Where this sits</p>
    <p><strong>${escape(gap.skill)}</strong> sits underneath the question you
    came in with. This is the route back up to it:</p>
    <ol class="upwards">${steps}</ol>
    <p class="note">This is the first thing in the way &mdash; there may be more
    once it clears.</p>
  </div>`;
}

function report() {
  const r = state.report;
  const gap = r.gaps[0];

  // Two different things can head this page, and the difference matters. A gap
  // is a skill we tested down to and will stand behind. An unconfirmed one is
  // the deepest thing that gave way before the walk stopped - real evidence,
  // not a conclusion. Saying which it is, out loud, is what makes offering the
  // second one honest; the alternative was a screen that named nothing at all
  // and left a student with nowhere to go.
  const guess = !gap && r.unconfirmed ? r.unconfirmed : null;
  const named = gap || guess;

  // Everything underneath held, so the walk came back up and named the very
  // skill they arrived stuck on. That is the right answer and it reads as an
  // absurd one: "you came in stuck on X" followed by "what's getting in the way
  // is X", after three answers all marked correct. It is also the one outcome
  // that is good news, and saying so is most of the fix.
  const nothingBelow = Boolean(
    gap && gap.skill === r.stuck_on && (r.asked || []).length &&
    (r.asked || []).every(a => a.held));

  // The reasoning is the whole point, and it was the thing missing: naming a
  // skill tells you nothing unless you can see why it, and not something
  // lower down.
  const why = gap
    ? (gap.held_beneath.length
        ? `<p>What we checked underneath it held up &mdash;
           ${listOf(gap.held_beneath.map(escape))} &mdash; so this is the right
           place to start, rather than something lower down.</p>`
        : gap.is_bedrock
          ? `<p>There&rsquo;s nothing underneath this one, so this is as far
             back as it goes.</p>`
          : '')
    : '';

  const how = named
    ? (named.nothing_there
        ? `<p>You said you didn&rsquo;t know instead of guessing &mdash;
           that&rsquo;s the honest answer, and more use to us than a guess. This
           one is new ground rather than something to unlearn.</p>`
        : (named.mistake
            ? `<p>You&rsquo;ve got a method for this one &mdash; it&rsquo;s just
               not quite the right one. That&rsquo;s usually quicker to sort out
               than starting from scratch. Here&rsquo;s what happened:</p>
               <p class="note">${escape(named.mistake)}</p>`
            : ''))
    : '';

  screen.innerHTML = `
    ${partsBar()}
    <div class="card">
      ${nothingBelow ? '' :
        `<p class="note">You came in stuck on ${escape(r.stuck_on)}</p>`}
      <p class="label">${nothingBelow ? 'Nothing underneath was missing'
        : gap ? 'What&rsquo;s getting in the way' : 'Where to start'}</p>
      ${nothingBelow ? `<p>You got every question we asked. Everything this
        rests on held up, so there is no gap lower down to go back for &mdash;
        the method itself is the thing to work on:</p>` : ''}
      ${guess ? `<p>We didn&rsquo;t get far enough to be sure what sits under
        this one. Of what you did answer, though, this is the first thing that
        gave way &mdash; so it is the place to start:</p>` : ''}
      <p class="gap">${named ? escape(named.skill) : 'We couldn&rsquo;t pin this one down'}</p>
      ${named && named.practice
        ? `<p class="practice">${mathHtml(named.practice)}</p>` : ''}
      ${how}
    </div>

    ${why && !nothingBelow ? `<div class="card">
      <p class="label">Why we stopped here</p>
      ${why}
    </div>` : ''}

    ${wayBack(gap, r.stuck_on)}

    ${gap ? `<div class="card" id="climb">
      <p class="label">Work up to your question</p>
      <p>Four questions that start where the gap is and build, one step at a
      time, up to the question you came in with.</p>
      <p><button onclick="startClimb()">Show me</button></p>
      <p class="note" id="climb-said" role="status" aria-live="polite"></p>
    </div>` : ''}

    ${canRetake() ? `<div class="card">
      <p class="label">When you&rsquo;ve worked on it</p>
      <p>${nothingBelow
        ? `Come back and run this again once you have worked on the method. The
           questions underneath are drawn fresh each time, so it is a real
           re-check rather than the same three.`
        : `Come back and run this same question again. It starts from scratch and
           asks fresh questions, so if ${named ? escape(named.skill) : 'this'}
           holds by then, it carries on past it and looks for whatever is behind
           it.`}</p>
      <p><button onclick="retake()">Try this question again</button></p>
    </div>` : ''}

    <details class="card">
      <summary>Every question you answered</summary>
      <ul>${r.asked.map(a =>
        `<li class="${a.held ? 'held' : 'missed'}">${escape(a.skill)}
          &mdash; ${a.held ? 'you got this'
                   : (a.dont_know ? 'you weren&rsquo;t sure' : 'not quite')}
         ${a.mistake ? `<br><span class="note">${escape(a.mistake)}</span>` : ''}</li>`
      ).join('')}</ul>
    </details>

    ${usefulCard()}
    ${verdictCard()}

    <p><button class="plain" onclick="newQuestion()">A different question</button></p>`;

  wireParts();
  wireUseful();
  if (isTutor()) wireVerdict();
}

// One tap, from whoever this was for. A different question from whether the
// diagnosis was correct - a right answer can still be no use, and a wrong one
// can still be worth the ten minutes - and the only one everybody can answer
// without thinking about it.
function usefulCard() {
  return `<div class="card useful" id="useful">
    <p class="note">Did this help?</p>
    <p>
      <button class="plain" data-useful="yes">Yes</button>
      <button class="plain" data-useful="no">Not really</button>
    </p>
    <p id="useful-said" class="note" role="status" aria-live="polite"></p>
  </div>`;
}

function wireUseful() {
  const said = document.getElementById('useful-said');
  document.querySelectorAll('#useful button').forEach(button => {
    button.onclick = async () => {
      document.querySelectorAll('#useful button').forEach(b => b.disabled = true);
      try {
        const reply = await post('/api/rating', {
          session_id: state.session_id,
          useful: button.dataset.useful === 'yes',
        });
        said.textContent = reply.message;
      } catch (error) {
        document.querySelectorAll('#useful button').forEach(b => b.disabled = false);
        said.className = 'error';
        said.textContent = error.message;
      }
    };
  });
}

// The only signal that can correct the graph. Everything else we record says
// how the walk behaved, not whether it was right.
function verdictCard() {
  if (!isTutor()) return '';
  // The note sits above the buttons rather than inside the correction, so it
  // can be left on either verdict. "Right, but it took nine questions" is worth
  // as much as a correction, and it had nowhere to go when the box only
  // appeared for people who disagreed.
  return `<div class="card" id="verdict">
    <p class="label">Was this right?</p>
    <label for="verdict-note">Anything worth knowing (optional)</label>
    <textarea id="verdict-note" placeholder="Right skill, but they got there by guessing."></textarea>
    <p>
      <button id="was-right">Yes, that was the gap</button>
      <button id="was-wrong">No</button>
    </p>
    <div id="correction" hidden>
      <label for="real-gap">What was it really?</label>
      <input type="text" id="real-gap" placeholder="Expanding brackets">
      <p><button id="send-verdict">Save</button></p>
    </div>
    <p id="verdict-msg" class="note"></p>
  </div>`;
}

function wireVerdict() {
  const msg = document.getElementById('verdict-msg');
  const correction = document.getElementById('correction');

  document.getElementById('was-right').onclick = () => sendVerdict('right');
  document.getElementById('was-wrong').onclick = () => {
    correction.hidden = false;
    document.getElementById('real-gap').focus();
  };
  document.getElementById('send-verdict').onclick = () => sendVerdict('wrong');

  async function sendVerdict(verdict) {
    const body = {session_id: state.session_id, verdict};
    body.note = document.getElementById('verdict-note').value.trim() || null;
    if (verdict === 'wrong') {
      body.actual_gap = document.getElementById('real-gap').value.trim() || null;
    }
    try {
      const saved = await post('/api/feedback', body);
      correction.hidden = true;
      document.querySelectorAll('#verdict button').forEach(b => b.disabled = true);
      msg.textContent = saved.actual_gap && !saved.matched_a_known_skill
        ? `Saved. "${saved.actual_gap}" is not a skill on the map, which is worth knowing.`
        : 'Saved.';
    } catch (error) {
      msg.className = 'error';
      msg.textContent = error.message;
    }
  }
}

function listOf(items) {
  if (items.length === 0) return '';
  if (items.length === 1) return items[0];
  return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
}

function outOfScope() {
  screen.innerHTML = `
    <div class="card">
      <p style="white-space: pre-wrap">${escape(state.message)}</p>
    </div>
    <p><button onclick="askScreen()">Try another question</button></p>`;
}

async function get(path) {
  const response = await fetch(path);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || 'Something went wrong.');
  return data;
}

async function post(path, body) {
  const response = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || 'Something went wrong.');
  return data;
}

// The longest edge a photo needs to be for the maths on it to be readable.
// A phone camera produces four times this, which is four megabytes of detail
// nobody looks at - and base64 adds a third again on top, all of it uploaded
// before the question has even been read.
const LONGEST_EDGE = 1800;

// Kept high on purpose. This is a picture of small handwriting and thin
// fraction bars, and compression artefacts land exactly on the strokes that
// tell a 3 from an 8.
const QUALITY = 0.9;

// Shrink an image before it goes anywhere. PDFs are passed through untouched -
// they cannot be resized here, and their text is already sharp at any size.
async function readyToSend(file) {
  if (!file.type.startsWith('image/')) return file;

  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, LONGEST_EDGE / Math.max(bitmap.width, bitmap.height));
    if (scale === 1) return file;

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);

    const smaller = await new Promise(done =>
      canvas.toBlob(done, 'image/jpeg', QUALITY));

    // If shrinking somehow made it bigger, keep what we had.
    if (!smaller || smaller.size >= file.size) return file;
    return new File([smaller], 'photo.jpg', {type: 'image/jpeg'});
  } catch (error) {
    // An old browser, or an image it cannot decode. Sending the original is
    // slower but it still works, and that matters more than it being small.
    return file;
  }
}

function asBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---- Maths -------------------------------------------------------------
//
// The bank stores maths the way a person types it - x^(-2), sqrt(136),
// (4x^2 + 3x)/(x - 2) - because that is what the model writes and what the
// audit compares. KaTeX needs LaTeX. So the notation is converted here, at the
// moment it is shown, rather than being stored twice.
//
// Questions are prose with maths in them, not maths, so this cannot simply
// typeset the whole string. It finds the runs that are actually notation and
// leaves the sentence alone.

// Written in plain ES5 - no arrow functions, no flatMap - so it runs in a
// bare JavaScript engine as well as a browser. That is what lets the tests
// exercise this exact code rather than a Python rewrite of it.

// Words that are maths even though they are only letters.
var FUNCTIONS = ['sqrt', 'sin', 'cos', 'tan', 'ln', 'log', 'pi', 'lim'];

// A token can join a maths run if it is notation rather than a word: it has a
// digit, or an operator, or it is a single letter being used as a variable.
// Two-letter words like "of" and "to" are how a run would otherwise swallow
// the sentence around it.
function canJoin(token) {
  if (!token) return false;
  if (FUNCTIONS.indexOf(token.toLowerCase()) !== -1) return true;
  if (/\d/.test(token)) return true;
  if (/[\^_+\-*\/=()\[\]<>|]/.test(token)) return true;
  // dx, dy, dt - the differential in an integral. Two letters, no operator,
  // so nothing else here would let them into a run, and they sit in the
  // middle of one: "sin(x) / cos(x) dx".
  if (/^d[a-z]$/.test(token)) return true;
  return /^[A-Za-z]$/.test(token);
}

// Only runs containing one of these are worth typesetting. Without it,
// "(3 - x)(2 + 5x)" would be re-rendered for no gain, and every re-render is
// a chance to make something worse.
//
// sqrt is matched without a word boundary because 4sqrt(3) is how coefficients
// come out of the bank, and \bsqrt\b misses it - which looked far worse than
// doing nothing, because sqrt(12) in the same sentence did typeset.
//
// Any slash inside a run counts. Requiring non-space either side missed
// "sin(x) / cos(x)", which is exactly the shape a quotient arrives in.
function worthIt(run) {
  return /[\^_]/.test(run) || /sqrt/.test(run) || run.indexOf('/') !== -1;
}

// a/b -> \frac{a}{b}, innermost first, brackets respected.
function fractions(text) {
// An operand may also drag a bracketed group behind it, which is what a
// negative or compound exponent looks like before the exponent rule has run:
// x^(-n), x^(2n), f(x). Without the optional group the alternation matched
// only the bare part, so 1 / x^(-n) came out as \frac{1}{x^}(-n) - an empty
// superscript, which KaTeX refuses, and the (-n) left stranded outside the
// fraction. A student was shown that as red source on an index-laws question.
  var operand = '(\\([^()]*(?:\\([^()]*\\)[^()]*)*\\)|[A-Za-z0-9{}^_\\\\]+(?:\\([^()]*\\))?)';
  var pattern = new RegExp(operand + '\\s*\\/\\s*' + operand);
  function bare(x) { return /^\(.*\)$/.test(x) ? x.slice(1, -1) : x; }
  var before;
  do {
    before = text;
    text = text.replace(pattern, function (whole, top, bottom) {
      return '\\frac{' + bare(top) + '}{' + bare(bottom) + '}';
    });
  } while (text !== before);
  return text;
}

function toLatex(run) {
  var out = run;
  out = out.replace(/sqrt\s*\(([^()]*(?:\([^()]*\)[^()]*)*)\)/g, '\\sqrt{$1}');
  // Not \b at the end: log_3 and sin^2 are both common, and a word boundary
  // fails on both because _ and ^ are not letters. The lookahead keeps it from
  // firing inside a longer word.
  out = out.replace(/\b(sin|cos|tan|ln|log)(?![a-z])(\s*\()?/g, function (whole, fn, opened) {
    return '\\' + fn + (opened ? '(' : ' ');
  });
  // The trailing space is what separates a command from a bare argument:
  // \sin x, never \sinx. A bracket separates it just as well, and keeping
  // the two together is what lets the fraction rule treat sin(x) as one
  // operand - without it, sin(x) / cos(x) came out as \sin \frac{x}{\cos} (x),
  // which KaTeX prints in red.
  out = out.replace(/\bpi\b/g, '\\pi ');
  // Fractions first, and the order is the bug this had.
  //
  // An operand may contain braces, because a fraction can sit over something
  // already converted. So if exponents run first, x^(1/2) has become x^{1/2}
  // by the time fractions sees it - and then the numerator matches x^{1 and
  // the denominator matches 2}, giving rac{x^{1}{2}}. KaTeX prints that in
  // red and swallows whatever follows into the denominator, which is how an
  // equals sign ended up underneath a fraction on a student's screen.
  //
  // Run first, the division inside the brackets is turned into rac{1}{2}
  // while the brackets are still brackets, and the exponent rule wraps the
  // finished thing.
  out = fractions(out);

  // Exponents and subscripts, bracketed or bare. Bare has to be braced too, or
  // x^12 typesets as x^1 followed by a 2.
  //
  // A bare one is a run of digits or a single letter, and never a mixture.
  // [A-Za-z0-9]+ was greedy across both, so x^2y^3 - which is how the bank
  // writes a binomial term - had its exponent read as 2y, leaving x^{2y}^{3}.
  // That is a double superscript, which KaTeX refuses and prints in red, so
  // the coefficient a student was being asked about arrived as raw source.
  // Anything genuinely multi-character goes in brackets: x^(2n), not x^2n.
  out = out.replace(/\^\s*\(([^()]*)\)/g, '^{$1}');
  out = out.replace(/\^\s*(-?\d+|-?[A-Za-z])/g, '^{$1}');
  out = out.replace(/_\s*\(([^()]*)\)/g, '_{$1}');
  out = out.replace(/_\s*(-?\d+|-?[A-Za-z])/g, '_{$1}');
  out = out.replace(/\*/g, ' \\cdot ');
  out = out.replace(/<=/g, ' \\le ').replace(/>=/g, ' \\ge ');
  out = out.replace(/!=/g, ' \\ne ');
  // Whatever angle brackets are left are inequalities, and LaTeX has words for
  // those. Turning them into relations here means no run can carry a tag as
  // far as the renderer: a question containing a closing script tag arrives
  // with a slash in it, which is enough to make it look like a fraction and
  // get typeset. KaTeX escapes its own output, but nothing student-facing
  // should rest on that being true of whichever version is on the CDN.
  //
  // That tag is described rather than written here on purpose. The HTML parser
  // ends a script block at the first one it sees, inside a comment or a string
  // or not - which is exactly how this comment, in an earlier form, took the
  // page down and printed the rest of the file on screen as text.
  out = out.replace(/</g, ' \\lt ').replace(/>/g, ' \\gt ');
  return out;
}

// Quotation marks and sentence punctuation clinging to the ends of a run.
//
// A question that quotes a student back - They write: 'sqrt(x^6) = ...' -
// hands the whole quoted string to the maths run, apostrophes and all, because
// the token has brackets and carets in it and so reads as notation. A leading
// apostrophe in maths is a prime with nothing to attach to; KaTeX refuses it
// and prints the entire line as red source. Seen on an index-form question.
var EDGE_BEFORE = /^['\"\u2018\u201c]+/;
var EDGE_AFTER = /['\"\u2019\u201d.,;:!?]+$/;

function typeset(run) {
  // Whatever survived normalise() is a symbol nobody anticipated, and KaTeX
  // will not know it either. With throwOnError off it fails silently and red,
  // so it is shown as plain text instead - unstyled, but readable and never
  // the wrong colour.
  if (/[^\x00-\x7F]/.test(run)) return escape(run);

  // Peel the punctuation off both ends and set it as text, so the maths in
  // the middle still typesets. Only when something is left worth typesetting -
  // a run that is punctuation around a bare word is not maths at all.
  var before = (run.match(EDGE_BEFORE) || [''])[0];
  var after = (run.match(EDGE_AFTER) || [''])[0];
  if (before || after) {
    var core = run.slice(before.length, run.length - after.length);
    if (core && worthIt(core)) {
      return escape(before) + typeset(core) + escape(after);
    }
  }
  try {
    return katex.renderToString(toLatex(run), {
      throwOnError: false,
      displayMode: false,
      output: 'html',
    });
  } catch (error) {
    return escape(run);
  }
}

// Splits a string into words, holding trailing sentence punctuation back so a
// full stop is never typeset as part of an expression.
function pieces(text) {
  var raw = String(text).split(/(\s+)/);
  var out = [];
  for (var i = 0; i < raw.length; i++) {
    var part = raw[i];
    if (!part) continue;
    if (/^\s+$/.test(part)) { out.push({text: part, space: true}); continue; }
    var match = part.match(/^([\s\S]*?)([.,;:?!]*)$/);
    if (match[1]) out.push({text: match[1], word: true});
    if (match[2]) out.push({text: match[2], punctuation: true});
  }
  return out;
}

// The bank is meant to hold plain ASCII and mostly does. What slips through
// is always the same handful of symbols, and KaTeX knows none of them: it
// prints the character itself, in red, in the middle of the question. Mapping
// them back to the notation the converter already understands is the
// difference between pi typesetting and a student seeing red source.
//
// Prose punctuation is deliberately absent. An em dash is not maths, a pound
// sign is not maths, and rewriting either would damage a sentence to fix a
// problem they do not have.
var SYMBOLS = [
  [/\u03c0/g, ' pi '],    [/\u222b/g, ' integral '],
  [/\u00b2/g, '^2'],      [/\u00b3/g, '^3'],
  [/\u00b1/g, ' +/- '],   [/\u2260/g, ' != '],
  [/\u00d7/g, ' * '],     [/\u00f7/g, ' / '],
  [/\u2212/g, '-'],       [/\u2248/g, ' approx ']
];

function normalise(text) {
  var out = String(text);
  for (var i = 0; i < SYMBOLS.length; i++) {
    out = out.replace(SYMBOLS[i][0], SYMBOLS[i][1]);
  }
  return out.replace(/[ \t]{2,}/g, ' ');
}

function mathHtml(text) {
  if (text === null || text === undefined) return '';
  if (!window.katex) return escape(text);

  var parts = pieces(normalise(text));
  var html = '', run = [], gap = '';

  function flush() {
    if (!run.length) return;
    var joined = run.join(' ');
    html += worthIt(joined) ? typeset(joined) : escape(joined);
    run = [];
  }

  for (var i = 0; i < parts.length; i++) {
    var part = parts[i];
    if (part.space) {
      if (run.length) gap = part.text; else html += part.text;
      continue;
    }
    if (part.word && canJoin(part.text)) {
      if (run.length && gap) gap = '';
      run.push(part.text);
      continue;
    }
    flush();
    if (gap) { html += gap; gap = ''; }
    html += escape(part.text);
  }
  flush();
  if (gap) html += gap;
  return html;
}

function escape(text) {
  const node = document.createElement('div');
  node.textContent = text ?? '';
  return node.innerHTML;
}

const existing = sessionInUrl();
if (existing) resume(existing); else askScreen();
</script>
