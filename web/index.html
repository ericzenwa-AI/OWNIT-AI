  // ends a script block at the first one it sees, inside a comment or a string
  // or not - which is exactly how this comment, in an earlier form, took the
  // page down and printed the rest of the file on screen as text.
  out = out.replace(/</g, ' \\lt ').replace(/>/g, ' \\gt ');
  return out;
}

// Quotation marks and sentence punctuation clinging to the ends of a run.
//
// A question that quotes a student back - They write: 'sqrt(x^6) = ...' -
// hands the whole quoted string to the maths run, apostrophes and all, because
// the token has brackets and carets in it and so reads as notation. A leading
// apostrophe in maths is a prime with nothing to attach to; KaTeX refuses it
// and prints the entire line as red source. Seen on an index-form question.
var EDGE_BEFORE = /^['\"\u2018\u201c]+/;
var EDGE_AFTER = /['\"\u2019\u201d.,;:!?]+$/;

function typeset(run) {
  // Whatever survived normalise() is a symbol nobody anticipated, and KaTeX
  // will not know it either. With throwOnError off it fails silently and red,
  // so it is shown as plain text instead - unstyled, but readable and never
  // the wrong colour.
  if (/[^\x00-\x7F]/.test(run)) return escape(run);

  // Peel the punctuation off both ends and set it as text, so the maths in
  // the middle still typesets. Only when something is left worth typesetting -
  // a run that is punctuation around a bare word is not maths at all.
  var before = (run.match(EDGE_BEFORE) || [''])[0];
  var after = (run.match(EDGE_AFTER) || [''])[0];
  if (before || after) {
    var core = run.slice(before.length, run.length - after.length);
    if (core && worthIt(core)) {
      return escape(before) + typeset(core) + escape(after);
    }
  }
  try {
    return katex.renderToString(toLatex(run), {
      throwOnError: false,
      displayMode: false,
      output: 'html',
    });
  } catch (error) {
    return escape(run);
  }
}

// Splits a string into words, holding trailing sentence punctuation back so a
// full stop is never typeset as part of an expression.
function pieces(text) {
  var raw = String(text).split(/(\s+)/);
  var out = [];
  for (var i = 0; i < raw.length; i++) {
    var part = raw[i];
    if (!part) continue;
    if (/^\s+$/.test(part)) { out.push({text: part, space: true}); continue; }
    var match = part.match(/^([\s\S]*?)([.,;:?!]*)$/);
    if (match[1]) out.push({text: match[1], word: true});
    if (match[2]) out.push({text: match[2], punctuation: true});
  }
  return out;
}

// The bank is meant to hold plain ASCII and mostly does. What slips through
// is always the same handful of symbols, and KaTeX knows none of them: it
// prints the character itself, in red, in the middle of the question. Mapping
// them back to the notation the converter already understands is the
// difference between pi typesetting and a student seeing red source.
//
// Prose punctuation is deliberately absent. An em dash is not maths, a pound
// sign is not maths, and rewriting either would damage a sentence to fix a
// problem they do not have.
var SYMBOLS = [
  [/\u03c0/g, ' pi '],    [/\u222b/g, ' integral '],
  [/\u00b2/g, '^2'],      [/\u00b3/g, '^3'],
  [/\u00b1/g, ' +/- '],   [/\u2260/g, ' != '],
  [/\u00d7/g, ' * '],     [/\u00f7/g, ' / '],
  [/\u2212/g, '-'],       [/\u2248/g, ' approx ']
];

function normalise(text) {
  var out = String(text);
  for (var i = 0; i < SYMBOLS.length; i++) {
    out = out.replace(SYMBOLS[i][0], SYMBOLS[i][1]);
  }
  return out.replace(/[ \t]{2,}/g, ' ');
}

function mathHtml(text) {
  if (text === null || text === undefined) return '';
  if (!window.katex) return escape(text);

  var parts = pieces(normalise(text));
  var html = '', run = [], gap = '';

  function flush() {
    if (!run.length) return;
    var joined = run.join(' ');
    html += worthIt(joined) ? typeset(joined) : escape(joined);
    run = [];
  }

  for (var i = 0; i < parts.length; i++) {
    var part = parts[i];
    if (part.space) {
      if (run.length) gap = part.text; else html += part.text;
      continue;
    }
    if (part.word && canJoin(part.text)) {
      if (run.length && gap) gap = '';
      run.push(part.text);
      continue;
    }
    flush();
    if (gap) { html += gap; gap = ''; }
    html += escape(part.text);
  }
  flush();
  if (gap) html += gap;
  return html;
}

function escape(text) {
  const node = document.createElement('div');
  node.textContent = text ?? '';
  return node.innerHTML;
}

const existing = sessionInUrl();
if (existing) resume(existing); else askScreen();
</script>
