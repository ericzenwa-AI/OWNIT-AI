<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ownIT</title>
<!-- The tab icon. Browsers in use today all take the SVG; favicon.ico is
     there for the bare /favicon.ico a browser asks for whether or not a page
     says to, and the touch icon is what iOS puts on a home screen. All three
     are the same mark - backend/icons.py draws the bitmaps from web/icon.svg
     geometry. -->
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- Typesetting only. If either of these fails to load, mathHtml() falls back
     to the plain text the bank stores, which is what the page showed before. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"
      crossorigin="anonymous">
<!-- Deferred, so it runs after the page's own inline script. Anything drawn
     before it arrives falls back to plain text and would stay that way, so
     the page is asked to draw itself once more when it lands. -->
<script defer
        src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
        crossorigin="anonymous"
        onload="window.typesetAgain && window.typesetAgain()"></script>
<style>
  /* ------------------------------------------------------------------
     The same two colour systems as the landing page, and the same rule
     about which is which.

     One accent, spent only on things you can act on: the Start button,
     an option under the cursor, a focus ring.

     Green and rust are not decoration here - they are the answer. Green
     is a skill that held, rust is where it broke. The accent never
     appears on a verdict, and a verdict colour never appears on a
     control.
     ------------------------------------------------------------------ */
  /* ------------------------------------------------------------------
     The tutoring workspace: one dark surface, not a light page with a dark
     mode bolted on.

     It is deliberately a single look rather than following the system. This
     is the screen a student sits inside for ten minutes being taught, and a
     room with the lights set once reads as a place; a page that is cream on
     one phone and ink on another reads as a document. The two public pages
     keep their own light design - they are something you read and leave.

     Violet carries anything the student can act on. Blue carries the
     machinery talking - stages, demonstrations, progress. Green and rust
     still mean exactly what they mean everywhere else in this product: a
     skill that held, and the place it broke. Those two are never spent on
     decoration.

     Contrast measured against the --bg below, not guessed: ink 17.1:1,
     muted 8.9:1, faint 5.3:1, violet 5.4:1, and near-black on violet 7.0:1
     for button text.
     ------------------------------------------------------------------ */
  :root {
    --bg:      #0A0C14;
    --card:    #121626;
    --sunk:    #0E1220;
    --ink:     #EDEFF8;
    --muted:   #A7AECA;
    --faint:   #7B83A4;
    --line:    #222941;
    --accent:  #8B7CFF;
    --accent-2:#4EA8FF;
    --on-accent: #0A0C14;

    --held:    #5FD3A6;
    --broke:   #FF8F6E;

    /* On a dark ground a shadow does nothing; depth comes from the surface
       lifting and from a one-pixel edge catching the light. */
    --lift: 0 1px 0 rgba(255, 255, 255, 0.04) inset,
            0 18px 40px -24px rgba(0, 0, 0, 0.8);
    --glow: 0 0 0 1px rgba(139, 124, 255, 0.35),
            0 10px 30px -12px rgba(139, 124, 255, 0.35);

    --sans: "Outfit", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "SF Mono", Menlo, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2.5rem 1.25rem 5rem;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 36rem; margin: 0 auto; }

  h1 {
    font-size: 1rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 0.4rem;
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
  }
  h1::before {
    content: "";
    width: 0.6rem; height: 0.6rem;
    border-radius: 3px;
    background: var(--accent);
  }
  .sub { color: var(--muted); font-size: 1rem; margin: 0 0 2.5rem; }

  /* ---- what you fill in ---- */

  label {
    display: block;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--ink);
    /* The three things being asked for are three separate questions, and
       ran together as one block of form. This is most of the gap. */
    margin: 2.25rem 0 0.6rem;
  }
  .card > label:first-child { margin-top: 0; }

  textarea, input[type=text] {
    width: 100%;
    padding: 0.9rem 1rem;
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
  }
  textarea { min-height: 5.5rem; resize: vertical; }
  ::placeholder { color: var(--faint); }

  /* The default control is a grey system button and the word "unstyled".
     ::file-selector-button reaches it without changing the markup. */
  input[type=file] {
    width: 100%;
    font-family: var(--sans);
    font-size: 0.92rem;
    color: var(--muted);
    background: var(--bg);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 0.85rem 1rem;
    cursor: pointer;
  }
  input[type=file]::file-selector-button {
    font-family: var(--sans);
    font-size: 0.92rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 0.5rem 0.9rem;
    margin-right: 0.9rem;
    cursor: pointer;
  }
  input[type=file]:hover { border-color: var(--accent); }
  input[type=file]::file-selector-button:hover { border-color: var(--accent); }

  /* ---- things you press ---- */

  button {
    font-family: var(--sans);
    font-size: 1.0625rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    padding: 0.9rem 1.5rem;
    border-radius: 12px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--on-accent);
    cursor: pointer;
    transition: filter 0.15s ease, transform 0.15s ease;
  }
  button:hover:not(:disabled) { filter: brightness(1.1); transform: translateY(-1px); }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #go { width: 100%; margin-top: 2rem; }

  button.option {
    display: block; width: 100%; text-align: left;
    margin: 0.6rem 0;
    font-size: 1rem;
    font-weight: 400;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1rem 1.1rem;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  button.option:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--sunk);
    transform: none;
    filter: none;
  }
  button.option:focus-visible {
    outline: none;
    box-shadow: var(--glow);
    border-color: var(--accent);
  }
  /* While an answer is in flight: the one pressed stays lit, the rest go
     quiet. Without it a tap looks like nothing happened on a slow phone. */
  button.option:disabled { opacity: 0.4; }
  button.option.chosen:disabled {
    opacity: 1;
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--card));
  }
  button.option .letter {
    display: inline-grid;
    place-items: center;
    width: 1.6rem;
    height: 1.6rem;
    margin-right: 0.8rem;
    border-radius: 7px;
    background: var(--sunk);
    border: 1px solid var(--line);
    color: var(--muted);
    font-weight: 600;
    font-size: 0.82rem;
    vertical-align: middle;
  }
  button.option:hover:not(:disabled) .letter {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* ---- the blocks ---- */

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 2rem 1.75rem;
    margin: 1.25rem 0;
    box-shadow: var(--lift);
  }

  /* The unaided question at the end of a lesson, set inside the lesson card
     so it reads as part of it rather than as a new screen. */
  .card-inset {
    margin: 1rem 0 0;
    padding: 1.1rem 1.2rem;
    background: var(--sunk);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .card-inset .question { font-size: 1.05rem; margin-bottom: 0.9rem; }
  .verdict { margin-top: 1rem; padding-left: 0.9rem; border-left: 2px solid var(--line); }
  .verdict.right { border-left-color: var(--held); }
  .verdict.right p { color: var(--held); }
  .verdict.wrong { border-left-color: var(--broke); }

  /* Their own question, held at the top of the workspace the whole way
     through - the diagnostic as well as the lesson. Answering five questions
     that are not yours, with yours nowhere on screen, is the moment this
     stops feeling like help with your homework. */
  .asked-card {
    position: sticky;
    top: 0;
    z-index: 5;
    margin: 0 0 1.25rem;
    padding: 0.9rem 1.1rem;
    background: color-mix(in srgb, var(--sunk) 86%, transparent);
    backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 14px;
  }
  .asked-card .skill { margin-bottom: 0.35rem; color: var(--accent-2); }
  .asked-card .asked-text {
    font-size: 0.98rem;
    line-height: 1.5;
    color: var(--ink);
    max-height: 4.5rem;
    overflow: auto;
  }

  /* One line tying this question to the last answer. The walk has always
     been adaptive; it just never said so, which is what made it read as a
     fixed questionnaire. */
  .because {
    margin: 0 0 1rem;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .because b { color: var(--held); font-weight: 600; }
  .because i { color: var(--broke); font-style: normal; font-weight: 600; }

  /* Something is happening. */
  .waiting { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--muted); }
  .waiting::before {
    content: "";
    width: 0.6rem; height: 0.6rem;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .waiting::before { animation: none; opacity: 0.8; }
  }

  /* Small, spaced and quiet: a card says what it is before it says
     anything else. The same treatment as the landing page's eyebrows. */
  .skill, .label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 0.9rem;
  }
  .label { color: var(--accent); }

  .question {
    font-size: 1.15rem;
    line-height: 1.6;
    margin-bottom: 1.5rem;
    white-space: pre-wrap;
  }

  /* The one statement on this page, so it gets the room a statement gets. */
  .gap {
    font-size: clamp(1.7rem, 6vw, 2.2rem);
    line-height: 1.15;
    letter-spacing: -0.035em;
    color: var(--held);
    font-weight: 700;
    margin: 0 0 1.1rem;
    text-wrap: balance;
  }

  /* The one instruction on the page. Sits directly under the gap it is
     about, and is the thing a student is meant to leave with, so it gets
     body size rather than the quieter note size used for asides. */
  .practice {
    font-size: 1.05rem;
    line-height: 1.65;
    margin: 0 0 1.1rem;
    padding-left: 0.9rem;
    border-left: 2px solid var(--held);
  }

  /* Context, not the task. Sits above the question box and must not compete
     with it for attention. */
  .card.scope { background: var(--sunk); box-shadow: none; padding: 1.4rem 1.5rem; }
  .card.scope p { font-size: 0.95rem; }
  .card.scope .note { margin-top: 0.7rem; }

  /* A step of the route, which opens. It has to read as something you can
     press without shouting - the gap above it is the headline, not this. */
  button.step {
    background: none;
    border: none;
    padding: 0;
    font: inherit;
    color: var(--accent);
    cursor: pointer;
    text-align: left;
    border-bottom: 1px solid currentColor;
  }
  button.step:hover { opacity: 0.75; }
  .step-body {
    margin: 0.8rem 0 1.2rem;
    padding-left: 0.9rem;
    border-left: 2px solid var(--line);
  }
  .step-body .label { margin-top: 1rem; }
  .worked {
    font-family: var(--mono);
    font-size: 0.95rem;
    background: var(--sunk);
    padding: 0.8rem 1rem;
    border-radius: 10px;
  }

  /* What they got right. Quiet rather than celebratory - it is there to make
     the finding land, not to congratulate anyone. */
  .held-up { color: var(--muted); margin-bottom: 1.1rem; }
  .held-up strong { color: var(--ink); }

  /* The way out of the finding, and the point of the whole page: the button
     sits above the explanation rather than below everything. */
  .teach { display: flex; flex-wrap: wrap; gap: 0.6rem 0.9rem; align-items: center;
           margin: 0 0 1.4rem; }
  .teach .note { flex: 1 1 14rem; }

  /* The line the page exists for: what the thing actually means, with no
     maths in it. Larger than body text because on this screen it IS the body
     text - everything under it is detail for somebody who wants detail. */
  .plain-said {
    font-size: 1.15rem;
    line-height: 1.6;
    margin: 0 0 1.1rem;
    text-wrap: pretty;
  }

  /* The real-life version, set in its own block so it reads as a step
     sideways rather than as more of the same paragraph. Often absent: some
     things are not like anything, and a forced comparison is worse than
     none, so this styles what is there and never leaves a gap when it
     isn't. */
  .like {
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0 0 1.2rem;
    padding: 0.9rem 1.1rem;
    background: var(--sunk);
    border-radius: 12px;
  }
  .like-tag {
    display: block;
    font-size: 0.8rem;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 0.35rem;
  }

  /* The accurate sentence, for whoever wants it. Closed by default and styled
     quietly on purpose: a student who understood the plain version should be
     able to walk past this without feeling they skipped something. */
  .precise { margin: 0 0 1.1rem; }
  .precise summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.95rem;
  }
  .precise p { margin: 0.7rem 0 0; }

  /* What usually goes wrong. Set apart from the sentences around it because
     it is the line a student recognises themselves in, and the one thing
     here that a correct explanation cannot do on its own. */
  .slip {
    font-size: 1.05rem;
    line-height: 1.6;
    margin: 0 0 1rem;
    padding-left: 0.9rem;
    border-left: 2px solid var(--broke);
  }

  /* The lesson. A conversation, so the two voices have to be told apart at a
     glance - but quietly: this is a tutor talking, not a chat app. */
  .card.lesson textarea {
    width: 100%;
    margin-bottom: 0.4rem;
    padding: 0.9rem 1rem;
    font-family: var(--sans);
    font-size: 1rem;
    line-height: 1.6;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 12px;
    resize: vertical;
  }
  .from-tutor { font-size: 1.05rem; line-height: 1.65; margin-bottom: 1.1rem; }
  /* The one thing they have to do now, set apart from the explaining. */
  .from-tutor .ask { margin: 0.6rem 0 0; font-weight: 600; }
  .from-them {
    margin: 0 0 1.1rem auto;
    max-width: 85%;
    padding: 0.6rem 0.9rem;
    border-radius: 12px;
    background: var(--sunk);
    color: var(--muted);
    white-space: pre-wrap;
  }
  /* A demonstration. Each line is the expression as it then stands, and the
     newest one is lit so the eye goes to what just happened rather than
     having to diff two lines of algebra. */
  .demo { margin: 0.9rem 0 1.1rem; }
  .demo-step {
    padding: 0.55rem 0.9rem;
    border-left: 2px solid var(--line);
    opacity: 0.55;
    transition: opacity 0.25s ease, border-color 0.25s ease;
  }
  .demo-step.now { opacity: 1; border-left-color: var(--accent); }
  .demo-line { font-family: var(--mono); font-size: 1.05rem; }
  .demo-note { margin: 0.3rem 0 0; font-size: 0.92rem; color: var(--muted); }
  /* What is new on this line, said in maths rather than described. */
  .demo-new {
    font-family: var(--mono);
    background: var(--sunk);
    border-radius: 6px;
    padding: 0.05rem 0.35rem;
    color: var(--ink);
  }
  @media (prefers-reduced-motion: reduce) {
    .demo-step { transition: none; }
  }

  /* A picture of the gap. Inlined rather than an <img> so it inherits the
     page's colours - one drawing, both themes - and costs no second request.
     Sized by the card, never by itself. */
  .visual {
    margin: 0 0 1.2rem;
    padding: 0.6rem 0;
  }
  .visual svg { width: 100%; height: auto; display: block; color: var(--ink); }

  /* Who made this. Quiet, but on every screen rather than tucked behind a
     link nobody presses - a student should know a person is behind it. */
  .by {
    margin: 3rem 0 0;
    padding-top: 1.4rem;
    border-top: 1px solid var(--line);
    color: var(--faint);
    font-size: 0.9rem;
  }
  .by strong { color: var(--muted); font-weight: 600; }

  /* The two halves of the form, told apart. They used to be one run of
     labels and inputs, which is how a question ended up in the working
     box. */
  .ask-for + .ask-for {
    margin-top: 1.6rem;
    padding-top: 1.4rem;
    border-top: 1px solid var(--line);
  }
  .ask-for.optional .label { color: var(--faint); }
  /* The box we are waiting on, after somebody has filled in the other one. */
  textarea.wants {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(139, 124, 255, 0.18);
  }

  .chain { color: var(--muted); font-size: 0.95rem; margin-top: 0.4rem; }
  .note { color: var(--muted); font-size: 0.95rem; }
  p { margin: 0 0 1rem; }
  p:last-child { margin-bottom: 0; }

  /* A tick or a cross, not our internal words for it. */
  .held::before { content: "\2713\00a0\00a0"; color: var(--held); }
  .missed::before { content: "\2717\00a0\00a0"; color: var(--broke); }
  ul { padding-left: 1.2rem; }
  li { margin: 0.5rem 0; }

  details summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 0.92rem;
    font-weight: 500;
  }
  details[open] summary { margin-bottom: 1rem; }
  strong { color: var(--ink); font-weight: 600; }

  .quiet-link {
    background: none; border: none; color: var(--muted);
    text-decoration: underline; padding: 0;
    font-size: 0.9rem; font-weight: 400;
  }
  .quiet-link:hover { transform: none; filter: none; color: var(--accent); }

  .error { color: var(--broke); }

  /* Quieter than a question card - it is a note about the question, not part
     of the diagnosis. */
  .card.parts { padding: 1rem 1.25rem; background: var(--sunk); box-shadow: none; }
  .card.parts .note { margin: 0; }
  button.quiet-link.part {
    font-weight: 600;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid currentColor;
    margin: 0 0.15rem;
  }
  button.quiet-link.part:hover { filter: none; transform: none; opacity: 0.75; }

  /* The chooser. Each part reads as a line of the question rather than a
     control, because that is what someone is scanning for. */
  .choices { margin-top: 1rem; }
  .choices .option {
    font-size: 1rem;
    line-height: 1.6;
    padding: 1rem 1.1rem;
    margin: 0.6rem 0;
  }
  .choices .letter { font-weight: 700; color: var(--accent); }
  /* A part we cannot reach is shown rather than hidden - knowing it was read
     and cannot be helped with is worth more than it quietly missing. */
  .option.dead {
    display: block;
    border: 1px dashed var(--line);
    border-radius: 12px;
    background: var(--sunk);
    color: var(--faint);
  }
  .option.dead .letter { color: var(--faint); }
  .option.dead .note { font-size: inherit; }

  /* Quieter than a question card - it is the working, not the question. */
  /* Two words and two buttons. Anything bigger and it reads as a form to fill
     in rather than a question to answer on the way past. */
  .card.useful { padding: 1.25rem 1.5rem; background: var(--sunk); box-shadow: none; }
  .card.useful .note { margin: 0 0 0.5rem; }
  button.plain {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--line);
    font-size: 0.95rem;
    padding: 0.6rem 1.1rem;
    margin-right: 0.5rem;
  }
  button.plain:hover:not(:disabled) {
    border-color: var(--accent);
    filter: none;
    transform: none;
  }

  /* Numbered, because the order is the point - each one is only reachable
     once the one before it holds. */
  ol.upwards {
    margin: 1rem 0 0;
    padding-left: 0;
    list-style: none;
    counter-reset: step;
  }
  /* The number is taken out of the flow rather than given a grid column.
     As a grid, the skill name and the note after it were two separate items,
     so the note wrapped onto the next row - into the column sized for a
     number - and came out one word per line down the side of the card. Any
     second element inside the item would have done the same. */
  ol.upwards li {
    counter-increment: step;
    position: relative;
    padding: 0.7rem 0 0.7rem 2.8rem;
    border-top: 1px solid var(--line);
    line-height: 1.55;
  }
  ol.upwards li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 0.75rem;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--on-accent);
    background: var(--accent);
    border-radius: 7px;
    width: 1.9rem; height: 1.9rem;
    display: grid; place-items: center;
  }
  /* Sits with the line it belongs to, not under it. */
  ol.upwards .note { white-space: normal; }

  .card.descent {
    padding: 1.25rem 1.5rem;
    background: var(--sunk);
    box-shadow: none;
  }
  .card.descent ul { margin: 0; padding-left: 0; list-style: none; }
  .card.descent li {
    font-size: 0.95rem;
    margin: 0.35rem 0;
    color: var(--muted);
  }
  /* Each answer sits one step further in than the last, because that is what
     the walk is doing - going down, not along. */
  .card.descent li + li { padding-left: 0.9rem; }
  .card.descent li + li + li { padding-left: 1.8rem; }
  .card.descent li + li + li + li { padding-left: 2.7rem; }
  .card.descent li + li + li + li + li { padding-left: 3.6rem; }
  /* Said they did not know: not a mistake, and not a pass either. */
  .unsure::before { content: "?\00a0\00a0"; color: var(--faint); }

  /* Sits a touch up on Outfit, which has a taller x-height than the serif
     this used to be set in. For the notation only. */
  .katex { font-size: 1.05em; }
  /* A long quotient must not push the card sideways on a phone. */
  .question, button.option { overflow-x: auto; }

  .counter {
    color: var(--faint); font-size: 0.8rem; text-align: right;
    font-variant-numeric: tabular-nums;
  }

  /* The verdict card: two buttons side by side rather than stacked full width. */
  #verdict button { width: auto; margin-top: 0.5rem; margin-right: 0.5rem; }
  #verdict #send-verdict { margin-top: 1.25rem; }

  @media (max-width: 34rem) {
    .card { padding: 1.5rem 1.25rem; border-radius: 16px; }
    label { margin-top: 1.75rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <h1>ownIT</h1>
  <p class="sub">Stuck on a maths question? Let's find what's actually missing.</p>
  <div id="screen"></div>

  <!-- Outside #screen, so it survives every redraw: the diagnostic, the
       lesson and the finding all replace that div, and a line that vanished
       halfway through a session would be worse than not having one. -->
  <footer class="by">
    Built by <strong>Eric Ezenwa</strong>, maths tutor.
  </footer>
</main>

<script>
const screen = document.getElementById('screen');
let state = {};

// The lettered parts of the question, kept here rather than sent back and
// forth. Switching part starts a fresh walk, and the reply to that only knows
// about the part it was asked for - this is what remembers the rest.
let parts = null;
// What was typed or photographed, so a switch does not need it again.
let asked = null;

// The session id goes in the address bar, so the page a student is looking at
// is a page they can bookmark, and a link a tutor can send them back to. It is
// replaceState rather than pushState: every question is the same session, and
// the back button should leave the diagnostic rather than undo a question.

// ---- Counting what gets pressed -------------------------------------------
//
// The same tracker as the two public pages. Fire and forget, and never allowed
// to interrupt a walk: a student mid-diagnosis must not see an error because
// an analytics request failed.
function track(name, detail) {
  try {
    const body = JSON.stringify({
      name: name, page: location.pathname,
      session_id: (typeof state === 'object' && state) ? (state.session_id || null) : null,
      detail: detail || null});
    if (navigator.sendBeacon) {
      const sent = navigator.sendBeacon(
        '/api/event', new Blob([body], {type: 'application/json'}));
      if (sent) return;
    }
    fetch('/api/event', {
      method: 'POST', keepalive: true,
      headers: {'Content-Type': 'application/json'}, body: body});
  } catch (error) { /* counting is never worth an error */ }
}

function rememberSession(id) {
  if (!id) return;
  // Keep whatever else was on the link. Writing '?s=42' wholesale dropped
  // ?tutor=1 off the address on the very first question, so a link that had
  // been opened as a tutor stopped looking like one the moment it was used.
  const params = new URLSearchParams(location.search);
  params.set('s', id);
  history.replaceState(null, '', '?' + params.toString());
}

function forgetSession() {
  history.replaceState(null, '', location.pathname);
}

function sessionInUrl() {
  const id = new URLSearchParams(location.search).get('s');
  return id && /^\d+$/.test(id) ? id : null;
}

// Only a tutor should be judging a diagnosis. There is no sign-in yet, so this
// is a flag on the link rather than an account - enough to keep it away from
// students without pretending to be security.
//
// It sticks once set, because the flag was on the link and nowhere else: a
// tutor had to remember to type it every time, and every session they forgot
// was a verdict nobody recorded. ?tutor=0 turns it off again, which matters on
// a laptop a student also uses.
function isTutor() {
  const asked = new URLSearchParams(location.search).get('tutor');
  if (asked !== null) {
    const on = asked !== '0' && asked !== 'no';
    remember('ownit.tutor', on ? '1' : '');
    return on;
  }
  return recall('ownit.tutor') === '1';
}

// Storage throws rather than returning null in some private modes, so both of
// these have to be able to fail without taking the page down with them.
function remember(key, value) {
  try { localStorage.setItem(key, value); } catch (error) { /* not available */ }
}

function recall(key) {
  try { return localStorage.getItem(key); } catch (error) { return null; }
}

// A photo keeps the layout that copy-pasting destroys - powers and fractions
// come out of a PDF as loose numbers - so it is offered first.
// What is covered, and what is not, before a single keystroke.
//
// This page said nothing about scope. A tutor brought a trigonometry question,
// typed it out or photographed it, waited for it to be read, and only then
// found out - which is the worst possible moment to learn it and the likeliest
// reason someone never comes back.
//
// The list is read off the graph rather than written here, because a hardcoded
// one drifts and the failure it drifts into is telling a tutor that a topic is
// covered when it is not. The hardcoded copy below is the fallback for when
// that request does not answer; being a little out of date beats being silent.
const COVERED_FALLBACK =
  'differentiation, integration, indices and surds, quadratics, sequences ' +
  'and series, binomial expansion, exponentials and logarithms, functions, ' +
  'coordinate geometry, polynomials, linear equations, expanding and ' +
  'factorising, ratio and proportion, fractions, decimals and percentages, ' +
  'simultaneous equations, inequalities, and standard form';

async function showScope() {
  const into = document.getElementById('covers');
  if (!into) return;
  try {
    const response = await fetch('/api/health');
    const health = await response.json();
    const topics = (health.topics || []).slice().sort();
    if (topics.length) into.textContent = listOf(topics) + '.';
  } catch (error) {
    /* the fallback is already on the page */
  }
}

function askScreen() {
  screen.innerHTML = `
    <div class="card scope">
      <p class="label">What this covers</p>
      <p>A-level Pure, and the GCSE underneath it &mdash;
        <span id="covers">${COVERED_FALLBACK}.</span></p>
      <p class="note"><strong>Not trigonometry, statistics or mechanics yet.</strong>
        If it can&rsquo;t place your question it says so rather than guessing,
        and tells me what it turned away.</p>
    </div>

    <div class="card">
      <!-- Two groups, each with its own heading, because they were one run
           of labels and inputs where the optional heading sat above the
           file button rather than its own box - and both boxes said "or
           type it out". People put the question in the second one, pressed
           Start, and were told to give a question. -->
      <div class="ask-for">
        <p class="label">Your question</p>
        <label for="photo">A photo of it &mdash; best, if it has fractions or powers</label>
        <input type="file" id="photo" accept="image/*,application/pdf">
        <label for="text">Or type the question here</label>
        <textarea id="text" placeholder="Simplify (x^5 * x^2) / x^3"></textarea>
      </div>

      <div class="ask-for optional">
        <p class="label">What you tried &mdash; optional</p>
        <label for="working">A photo of your working</label>
        <input type="file" id="working" accept="image/*,application/pdf">
        <label for="attempt">Or say what you did</label>
        <textarea id="attempt" placeholder="I multiplied the powers and got x^10"></textarea>
      </div>

      <p><button id="go">Start</button></p>
      <p id="msg" class="note"></p>
    </div>`;
  document.getElementById('go').onclick = start;
  showScope();
}

async function start() {
  const button = document.getElementById('go');
  const msg = document.getElementById('msg');
  const file = document.getElementById('photo').files[0];
  const text = document.getElementById('text').value.trim();

  if (!file && !text) {
    // Saying "give me the question" to somebody who has just typed one -
    // into the other box - is the version of this that got reported. Name
    // the box, and put the cursor in it.
    const tried = document.getElementById('attempt').value.trim();
    const working = document.getElementById('working').files[0];
    msg.className = 'error';
    msg.textContent = (tried || working)
      ? 'That went in the "what you tried" part. The question itself goes in '
        + 'the box at the top.'
      : 'Give me the question, or a photo of it.';
    const box = document.getElementById('text');
    box.classList.add('wants');
    box.focus();
    box.scrollIntoView({block: 'center', behavior: 'smooth'});
    return;
  }
  msg.className = 'note';
  document.getElementById('text').classList.remove('wants');

  track('sent_question', file ? 'photo' : 'typed');

  button.disabled = true;

  const working = document.getElementById('working').files[0];

  const body = {
    question: text,
    attempt: document.getElementById('attempt').value.trim() || null,
  };

  if (file || working) msg.textContent = 'Getting the photo ready...';

  if (file) {
    const ready = await readyToSend(file);
    body.attachment = await asBase64(ready);
    body.attachment_type = ready.type;
  }
  // A photo of the working is read the same way the question is, and for the
  // same reason: it is done on paper, and typing it out loses the notation.
  if (working) {
    const ready = await readyToSend(working);
    body.attempt_attachment = await asBase64(ready);
    body.attempt_attachment_type = ready.type;
  }

  msg.textContent = working
    ? 'Reading the question and your working...'
    : 'Reading the question...';

  try {
    state = await post('/api/start', body);
    asked = body;
    parts = state.parts || null;
    // A multi-part question comes back with no session: nothing is walked
    // until a part is chosen, so there is nothing to remember yet.
    if (state.session_id) rememberSession(state.session_id);
    draw();
  } catch (error) {
    button.disabled = false;
    msg.className = 'error';
    msg.textContent = error.message;
  }
}

// Someone who sends a whole exam question is rarely stuck on part (a) - that
// is usually the one they could do. Switching starts a new walk on the part
// they choose, using the skill we worked out when the question was first read,
// so it costs nothing to change your mind.
async function switchTo(label) {
  const part = (parts || []).find(p => p.label === label);
  if (!part || !part.covered || part.current) return;

  screen.innerHTML = '<div class="card"><p class="note">Starting on part (' +
    escape(label) + ')...</p></div>';


  try {
    state = await post('/api/start', {
      question: asked ? asked.question : '',
      attempt: asked ? asked.attempt : null,
      start_at: part.skill_id,
      start_summary: part.summary,
    });
    parts = (parts || []).map(p => Object.assign({}, p, {current: p.label === label}));
    rememberSession(state.session_id);
    draw();
  } catch (error) {
    screen.innerHTML = `<div class="card"><p class="error">${escape(error.message)}</p></div>
      <p><button onclick="newQuestion()">Start again</button></p>`;
  }
}

// Reads as a sentence rather than a row of buttons, because it is telling
// someone something they did not know - that the rest of their question was
// read - as much as it is offering them a control.
function partsBar() {
  if (!parts || parts.length < 2) return '';

  const here = parts.find(p => p.current);
  if (!here) return '';
  const others = parts.filter(p => !p.current);
  const offer = others.filter(p => p.covered);
  const cannot = others.filter(p => !p.covered);

  const links = offer.map(p =>
    `<button class="quiet-link part" data-part="${escape(p.label)}"
             title="${escape(p.summary)}">(${escape(p.label)})</button>`).join(' ');

  const missing = cannot.length
    ? ` I can't help with ${listOf(cannot.map(p => '(' + escape(p.label) + ')'))} yet.`
    : '';

  return `<div class="card parts">
    <p class="note">This question has ${parts.length} parts. Working on
    <strong>(${escape(here ? here.label : 'a')})</strong>.${
      offer.length ? ` Stuck on a different one? ${links}` : ''}${missing}</p>
  </div>`;
}

function wireParts() {
  document.querySelectorAll('button.part').forEach(b => {
    b.onclick = () => switchTo(b.dataset.part);
  });
}

async function answer(label) {
  // The one they pressed stays lit and the rest go quiet, with a line saying
  // something is happening. On a slow phone the old version looked like the
  // tap had missed.
  document.querySelectorAll('button.option').forEach(b => {
    b.disabled = true;
    if (b.querySelector('.letter')?.textContent === label) b.classList.add('chosen');
  });
  const options = document.getElementById('options');
  if (options) {
    options.insertAdjacentHTML('afterend',
      '<p class="waiting" role="status">Working out what to ask next</p>');
  }

  try {
    state = await post('/api/answer', {
      session_id: state.session_id,
      label,
      answered_before: state.asked_so_far,
    });
    rememberSession(state.session_id);
    draw();
  } catch (error) {
    screen.insertAdjacentHTML('beforeend', `<p class="error">${error.message}</p>`);
  }
}

// Following a link to a walk already in progress. The question comes back in
// the order it was shown, so the letters mean what they meant yesterday.
async function resume(id) {
  screen.innerHTML = '<div class="card"><p class="note">Finding where you left off...</p></div>';
  try {
    state = await get('/api/session/' + id);
    draw();
  } catch (error) {
    forgetSession();
    screen.innerHTML = `<div class="card">
      <p class="error">${escape(error.message)}</p>
      <p class="note">That link may be from a walk that was never finished, or from
      a different device.</p>
    </div>
    <p><button onclick="newQuestion()">Start a new question</button></p>`;
  }
}

// Running the same question again, after working on what was in the way.
//
// Not a memory of what was found last time: a new session, walked from the top.
// That is the only way to find out whether the thing that gave way still does,
// and it is what makes the answer meaningful - if the gap holds now, the walk
// carries straight past it and names whatever is behind it instead.
//
// The doorway is reused rather than re-read. Same question, same place to start,
// and nothing is paid to work that out twice.
//
// The old attempt is deliberately dropped. It was the working from before they
// practised, and feeding it back in would narrow the new walk with stale
// evidence about a student who has since changed.
async function retake() {
  const r = state.report || {};
  if (!r.entry_skill_id) return;
  track('retake', r.entry_skill_id);

  // The original question is sent when the page still has it, and simply left
  // out when it does not. Starting at a known skill returns before /api/start
  // checks for a question at all, and the walk asks banked questions about
  // skills rather than anything about the original - so there is nothing to
  // resubmit. This used to refuse without it, which turned a photo question
  // reloaded from a link into a dead end, and photographing the question is
  // what most students actually do.
  const body = asked ? Object.assign({}, asked)
             : (r.question ? {question: r.question} : {});

  body.start_at = r.entry_skill_id;
  body.start_summary = r.presentation_note || '';
  delete body.attempt;
  delete body.attempt_attachment;
  delete body.attempt_attachment_type;

  screen.innerHTML = `<div class="card"><p class="note">Starting this question
    again, from the top&hellip;</p></div>`;

  // Starting at a known skill skips the read, and the read is what returns the
  // lettered parts. Without keeping them, retaking part (b) would silently lose
  // the way back to (a) and (c).
  const hadParts = parts;

  try {
    state = await post('/api/start', body);
    parts = state.parts || hadParts;
    if (state.session_id) rememberSession(state.session_id);
    draw();
  } catch (error) {
    screen.innerHTML = `<div class="card"><p class="error">${escape(error.message)}</p></div>
      <p><button onclick="newQuestion()">Start again</button></p>`;
  }
}

// Whether the question can be run again. Only the doorway is needed: the walk
// asks about skills, not about the question, so a photo that was never stored
// and a page that has been reloaded both retake perfectly well.
function canRetake() {
  return Boolean((state.report || {}).entry_skill_id);
}

function newQuestion() {
  track('another_question');
  forgetSession();
  state = {};
  parts = null;
  asked = null;
  askScreen();
}

// Called once if KaTeX finishes loading after the first screen was drawn.
// Without it a resumed session can sit there in plain ASCII for good.
window.typesetAgain = function () {
  try {
    if (lesson) return drawLesson();
    if (state && Object.keys(state).length) draw();
  } catch (error) { /* never worth breaking the page over */ }
};

function draw() {
  if (lesson) return;
  if (state.message) return outOfScope();
  if (state.parts && !state.session_id) return chooseScreen();
  if (state.finished) return report();
  question();
}

// A question with lettered parts asks which one before starting on any of
// them. Starting at (a) was starting on the part they are least likely to be
// stuck on - it is usually the one they could do - and two questions about the
// wrong part is a worse price than one tap.
function chooseScreen() {
  const rows = parts.map(part => part.covered
    ? `<button class="option part" data-part="${escape(part.label)}">
         <span class="letter">(${escape(part.label)})</span>${escape(part.summary)}
       </button>`
    : `<div class="option dead">
         <span class="letter">(${escape(part.label)})</span>${escape(part.summary)}
         <span class="note"> &mdash; not something I can help with yet.</span>
       </div>`).join('');

  screen.innerHTML = `
    <div class="card">
      <div class="skill">This question has ${parts.length} parts</div>
      <p class="note">Which one are you stuck on?</p>
      <div class="choices">${rows}</div>
    </div>`;

  wireParts();
}

// The descent as it happens, rather than only in the report at the end.
//
// This was tutor-only at first, on the grounds that a student watching a column
// of crosses build up is being told something discouraging they cannot act on
// until the end. That was the wrong call for two reasons: the person using this
// is a tutor, so the gate mostly hid it from the people it was for, and it was
// hidden behind a flag on a link that you had to already know about.
//
// It shows nothing until the first question is answered, which is correct - on
// the opening screen there is nothing to show yet.
function descent() {
  if (!state.so_far || !state.so_far.length) return '';

  const rows = state.so_far.map(a => {
    const how = a.dont_know ? 'unsure' : (a.held ? 'held' : 'missed');
    return `<li class="${how}">${escape(a.skill_name)}</li>`;
  }).join('');

  return `<div class="card descent">
    <div class="skill">Where it has got to</div>
    <ul>${rows}</ul>
  </div>`;
}

// What they came in with, kept at the top of the workspace for the whole
// session. `matched` is the model's one-line reading of their question, which
// is what we have when the question arrived as a photo and the image is gone.
function askedCard() {
  const asked = (state.report && state.report.question)
    || state.question || state.matched || '';
  if (!asked) return '';
  return `<div class="asked-card">
    <div class="skill">Your question</div>
    <div class="asked-text">${mathHtml(asked)}</div>
  </div>`;
}

// Why this question and not another one. Read off the answers we already
// have, so it is simply true - the walk goes down into whatever gave way and
// sideways when something holds, and saying which just stops it reading as a
// fixed list.
function because() {
  const so_far = state.so_far || [];
  if (!so_far.length) return '';

  const last = so_far[so_far.length - 1];
  const name = escape(last.skill_name || 'that');
  if (last.dont_know) {
    return `<p class="because">You weren't sure about <i>${name}</i> &mdash;
      looking at what sits under it.</p>`;
  }
  if (last.held) {
    return `<p class="because"><b>${name}</b> held, so that isn't it.
      Trying something else at the same level.</p>`;
  }
  return `<p class="because"><i>${name}</i> gave way &mdash; going one step
    underneath it.</p>`;
}

function question() {
  const q = state.asking;
  screen.innerHTML = `
    ${askedCard()}
    ${partsBar()}
    <div class="card">
      <!-- Says why this is being asked without naming the chain. The chain is
           most of how you would approach their question, and announcing what
           we suspect before they answer invites them to answer to it. The
           skill's own name is our vocabulary anyway - it belongs in the
           tutor's report, not on a student's screen.

           The first one explains what is happening, because being asked
           something that is not your question, with no reason given, is the
           moment a student decides this is a test and leaves. -->
      <div class="skill">${state.asked_so_far
        ? 'Something your question rests on'
        : 'Before your question &mdash; something underneath it'}</div>
      ${because()}
      <div class="question">${mathHtml(q.question)}</div>
      <div id="options"></div>
    </div>
    ${descent()}
    <!-- A count, never "3 of 6". The walk is adaptive - median three questions
         and anywhere from one to thirteen - so any denominator would be made
         up, and it would be the only number on the screen. -->
    <p class="counter">Question ${state.asked_so_far + 1}${state.asked_so_far
      ? ' &middot; nothing here is marked' : ''}</p>`;

  const box = document.getElementById('options');
  q.options.forEach(o => {
    const button = document.createElement('button');
    button.className = 'option';
    button.innerHTML = `<span class="letter">${o.label}</span>${mathHtml(o.text)}`;
    button.onclick = () => answer(o.label);
    box.appendChild(button);
  });

  wireParts();
}

// Where this goes once the gap is cleared.
//
// The report named the gap and stopped there, which leaves a student with one
// thing to fix and no sense of what fixing it buys them. The chain has been
// computed and sent to this page the whole time - it is the route the walk took
// down - and reversed it is the order things open back up in, ending at the
// question they actually came with.
//
// This used to be kept off the student's screen, on the reasoning that "your
// A-level question failed at fraction arithmetic" is demoralising. Read
// downward it is. Read upward, which is how it is set out here, it is the way
// back to their own question - so it stays, and the wording carries it.
function wayBack(gap, stuckOn) {
  if (!gap || !gap.chain || gap.chain.length < 2) return '';

  // Stored top-down: the question first, the gap last. It opens up the other
  // way, and the gap itself is already named above.
  // `steps` when the reply has it, `chain` when it does not. Both are the same
  // route; one carries what is needed to open a step and the other is names.
  const route = (gap.steps && gap.steps.length) ? gap.steps : (gap.chain || []);
  const upwards = route.slice().reverse().slice(1);
  if (!upwards.length) return '';

  const steps = upwards.map((step, i) => {
    const last = i === upwards.length - 1;
    const name = escape(step.name || step);
    // The last one is their own question, not a skill to learn, so it does not
    // open. Everything below it does.
    if (last) {
      return `<li>${name} <span class="note">&mdash; where you started</span></li>`;
    }
    return `<li><button class="step" onclick="openStep('${escape(step.id)}')">
      ${name}</button><div class="step-body" id="step-${escape(step.id)}" hidden></div></li>`;
  }).join('');

  // The one caveat left on this screen. The card listing what we did not check
  // was tutor information and read to a student as a disclaimer, but the walk
  // really does follow one trail rather than everything, and a single named
  // skill otherwise reads as the whole story.
  return `<div class="card">
    <p class="label">Where this sits</p>
    <p><strong>${escape(gap.skill)}</strong> sits underneath the question you
    came in with. This is the route back up to it:</p>
    <ol class="upwards">${steps}</ol>
    <p class="note">This is the first thing in the way &mdash; there may be more
    once it clears.</p>
  </div>`;
}

// Open one step of the route and read what it is. Everything needed is already
// on the page - the explanation and any picture came down with the report - so
// this costs no request and works with the connection dropped.
function openStep(id) {
  const into = document.getElementById('step-' + id);
  if (!into) return;

  if (!into.hidden) { into.hidden = true; return; }
  track('step_opened', id);

  const step = stepFor(id);
  const said = step && step.explanation;
  if (!said) {
    into.innerHTML = `<p class="note">Nothing written for this one yet.</p>`;
    into.hidden = false;
    return;
  }

  // Same order as the finding above it, for the same reason: somebody opening
  // a step of the route is opening it because they do not know what it is.
  into.innerHTML = `
    ${said.plain ? `<p class="plain-said">${mathHtml(said.plain)}</p>` : ''}
    ${said.like ? `<p class="like"><span class="like-tag">Think of it like
      this</span> ${mathHtml(said.like)}</p>` : ''}
    ${step.visual ? `<figure class="visual">${step.visual}</figure>` : ''}
    <p>${mathHtml(said.what)}</p>
    <p class="worked">${mathHtml(said.example)}</p>
    <p class="label">What usually goes wrong</p>
    <p class="slip">${mathHtml(said.wrong)}</p>`;
  into.hidden = false;
}

function stepFor(id) {
  const gaps = ((state.report || {}).gaps) || [];
  for (const gap of gaps) {
    for (const step of (gap.steps || [])) {
      if (step && step.id === id) return step;
    }
  }
  return null;
}

// ---- The lesson -----------------------------------------------------------
//
// What happens after the diagnosis. The walk says what is missing; this is
// where somebody actually learns it, one exchange at a time.
//
// It owns the screen while it runs - draw() stands aside the way it does for
// any other full-screen state - and it never touches the diagnosis. Closing
// the tab loses nothing: every turn is on the server, and opening the lesson
// again replays it.
let lesson = null;

async function startLesson() {
  lesson = {turns: [], waiting: true, stage: null, finished: false};
  drawLesson();

  // Anything said earlier comes back first, so this is resuming rather than
  // starting over for somebody who has been here before.
  try {
    const had = await get('/api/teach/' + state.session_id);
    if (had.turns && had.turns.length) {
      // Coming back to a lesson shows the demonstrations complete: making
      // somebody re-click through what they already watched is a toy.
      lesson.turns = had.turns.map(turn => Object.assign({}, turn,
        {shown: (turn.demo || []).length}));
      lesson.stage = had.stage;
      lesson.finished = had.finished;
      lesson.waiting = false;
      drawLesson();
      return;
    }
  } catch (error) { /* nothing to resume, which is the normal case */ }

  await sayToTutor('');
}

function leaveLesson() {
  lesson = null;
  draw();
}

async function sayToTutor(said) {
  lesson.waiting = true;
  if (said) lesson.turns.push({said: said, say: null, ask: null});
  drawLesson();

  try {
    const got = await post('/api/teach', {
      session_id: state.session_id, said: said});
    // The first line of a demonstration is on screen straight away; the rest
    // are uncovered by them, which is what makes it something they watch
    // rather than a block that appears.
    lesson.turns.push({said: null, say: got.say, ask: got.ask,
                       demo: got.demo || [], shown: (got.demo || []).length ? 1 : 0});
    lesson.stage = got.stage;
    lesson.finished = got.finished;
    lesson.trouble = null;
  } catch (error) {
    // Nothing was stored server-side, so trying again picks up exactly here.
    lesson.trouble = 'That did not get through. Try again.';
  }
  lesson.waiting = false;
  drawLesson();
}

// A worked demonstration, uncovered one line at a time.
//
// Not a drawing. The page already renders maths properly and that pipeline is
// the one thing here that has been through four rounds of rendering bugs, so
// a demonstration is lines of maths put through it - what is new is the
// staging: one step at a time, the newest line lit up, and a word on what
// moved. A student watches it happen instead of reading that it happened.
function demoHtml(demo, shown, index) {
  if (!demo || !demo.length) return '';

  const lines = demo.slice(0, shown).map((step, n) => {
    const now = n === shown - 1;
    return '<div class="demo-step' + (now ? ' now' : '') + '">'
      + '<div class="demo-line">' + mathHtml(step.show) + '</div>'
      + (now && step.note
          ? '<p class="demo-note">' + mathHtml(step.note)
            + (step.changed
                ? ' <span class="demo-new">' + mathHtml(step.changed) + '</span>'
                : '')
            + '</p>'
          : '')
      + '</div>';
  }).join('');

  const more = shown < demo.length
    ? '<p><button class="plain" data-more="' + index + '">Show the next step</button></p>'
    : '';
  return '<div class="demo">' + lines + more + '</div>';
}

// The last thing: one question on the gap with no help attached.
//
// By the end of a lesson the tutor has hinted, shrunk the numbers and walked
// beside them, so "they have got it" is not something the lesson can honestly
// judge about itself. This is a question off the same checked shelf the
// diagnostic uses, one they have not already been asked, marked by the
// server - the page is never told which option is right.
function checkHtml() {
  const check = lesson.check;
  if (check === null) {
    return '<p class="note">Nothing new left on the shelf for this one.</p>';
  }
  if (check.loading) return '<p class="waiting">Finding one</p>';
  if (check.verdict) {
    return `<div class="verdict ${check.verdict.correct ? 'right' : 'wrong'}">
      <p>${mathHtml(check.verdict.say)}</p>
      ${check.verdict.correct ? '' :
        '<p><button class="plain" id="check-me">Try another one</button></p>'}
    </div>`;
  }
  const options = check.options.map(o =>
    `<button class="option" data-check="${o.label}">
       <span class="letter">${o.label}</span>${mathHtml(o.text)}</button>`).join('');
  return `<div class="card-inset">
    <p class="label">On your own &mdash; ${escape(check.skill)}</p>
    <div class="question">${mathHtml(check.question)}</div>
    ${options}
  </div>`;
}

async function askForCheck() {
  lesson.check = {loading: true};
  drawLesson();
  try {
    const got = await get('/api/check/' + state.session_id);
    lesson.check = got.available ? got : null;
  } catch (error) {
    lesson.check = null;
  }
  drawLesson();
}

async function answerCheck(label) {
  try {
    lesson.check.verdict = await post('/api/check', {
      session_id: state.session_id, label: label});
  } catch (error) {
    lesson.check.verdict = {correct: false, say: 'That did not get through.'};
  }
  drawLesson();
}

function drawLesson() {
  const said = lesson.turns.map((turn, index) => turn.say
    ? '<div class="from-tutor">' + mathHtml(turn.say)
      + demoHtml(turn.demo, turn.shown || 0, index)
      + (turn.ask ? '<p class="ask">' + mathHtml(turn.ask) + '</p>' : '')
      + '</div>'
    : '<div class="from-them">' + escape(turn.said || '') + '</div>'
  ).join('');

  // The same pinned question as the diagnostic, rather than a second one
  // that looks nearly the same - it is the one thing on screen that should
  // not move between the two halves of the session.
  screen.innerHTML = `
    ${askedCard()}

    <div class="card lesson">
      ${said}
      ${lesson.waiting ? '<p class="note">Thinking...</p>' : ''}
      ${lesson.trouble ? `<p class="note warn">${escape(lesson.trouble)}</p>` : ''}

      ${lesson.finished ? `
        <p class="note">That is the thing that was in your way, and you just
        used it on your own question.</p>
        ${lesson.check === undefined
          ? `<p><button id="check-me">Try one on your own</button></p>`
          : checkHtml()}`
      : `
        <textarea id="reply" rows="3" ${lesson.waiting ? 'disabled' : ''}
          placeholder="Type what you get, or what you are thinking"></textarea>
        <p>
          <button id="send-reply" ${lesson.waiting ? 'disabled' : ''}>Send</button>
          <button class="plain" id="stuck" ${lesson.waiting ? 'disabled' : ''}>I am stuck</button>
          <button class="plain" id="enough" ${lesson.waiting ? 'disabled' : ''}>That's enough</button>
        </p>`}

      <p><button class="plain" onclick="leaveLesson()">Back to what we found</button></p>
    </div>`;

  const askCheck = document.getElementById('check-me');
  if (askCheck) askCheck.onclick = askForCheck;
  screen.querySelectorAll('[data-check]').forEach(button => {
    button.onclick = () => {
      screen.querySelectorAll('[data-check]').forEach(b => b.disabled = true);
      button.classList.add('chosen');
      answerCheck(button.dataset.check);
    };
  });

  screen.querySelectorAll('[data-more]').forEach(button => {
    button.onclick = () => {
      const turn = lesson.turns[Number(button.dataset.more)];
      turn.shown = (turn.shown || 0) + 1;
      drawLesson();
    };
  });

  const send = document.getElementById('send-reply');
  if (send) {
    const box = document.getElementById('reply');
    send.onclick = () => {
      const text = (box.value || '').trim();
      if (text) sayToTutor(text);
    };
    box.onkeydown = event => {
      if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send.onclick(); }
    };
    document.getElementById('stuck').onclick = () => sayToTutor("I am stuck");
    // The way out, next to the way in. Saying thanks ends it too, but a
    // student should not have to work out that it will.
    document.getElementById('enough').onclick = () => sayToTutor("thanks");
    box.focus();
  }
}

function report() {
  const r = state.report;
  // Counted here rather than when the walk finishes, because this is the
  // function that puts it in front of somebody.
  track('report_seen', (r.gaps && r.gaps[0] && r.gaps[0].skill_id) || 'none');
  const gap = r.gaps[0];

  // Two different things can head this page, and the difference matters. A gap
  // is a skill we tested down to and will stand behind. An unconfirmed one is
  // the deepest thing that gave way before the walk stopped - real evidence,
  // not a conclusion. Saying which it is, out loud, is what makes offering the
  // second one honest; the alternative was a screen that named nothing at all
  // and left a student with nowhere to go.
  const guess = !gap && r.unconfirmed ? r.unconfirmed : null;
  const named = gap || guess;

  // Everything underneath held, so the walk came back up and named the very
  // skill they arrived stuck on. That is the right answer and it reads as an
  // absurd one: "you came in stuck on X" followed by "what's getting in the way
  // is X", after three answers all marked correct. It is also the one outcome
  // that is good news, and saying so is most of the fix.
  // Everything they answered correctly on the way down, in the order asked.
  const heldUp = ((r.asked || []).filter(a => a.held).map(a => a.skill));

  const nothingBelow = Boolean(
    gap && gap.skill === r.stuck_on && (r.asked || []).length &&
    (r.asked || []).every(a => a.held));

  // The reasoning is the whole point, and it was the thing missing: naming a
  // skill tells you nothing unless you can see why it, and not something
  // lower down.
  const why = gap
    ? (gap.held_beneath.length
        ? `<p>What we checked underneath it held up &mdash;
           ${listOf(gap.held_beneath.map(escape))} &mdash; so this is the right
           place to start, rather than something lower down.</p>`
        : gap.is_bedrock
          ? `<p>There&rsquo;s nothing underneath this one, so this is as far
             back as it goes.</p>`
          : '')
    : '';

  const how = named
    ? (named.nothing_there
        ? `<p>You said you didn&rsquo;t know instead of guessing &mdash;
           that&rsquo;s the honest answer, and more use to us than a guess. This
           one is new ground rather than something to unlearn.</p>`
        : (named.mistake
            ? `<p>You&rsquo;ve got a method for this one &mdash; it&rsquo;s just
               not quite the right one. That&rsquo;s usually quicker to sort out
               than starting from scratch. Here&rsquo;s what happened:</p>
               <p class="note">${escape(named.mistake)}</p>`
            : ''))
    : '';

  screen.innerHTML = `
    ${partsBar()}
    <div class="card">
      ${nothingBelow ? '' :
        `<p class="note">You came in stuck on ${escape(r.stuck_on)}</p>`}
      <p class="label">${nothingBelow ? 'Nothing underneath was missing'
        : gap ? 'We found something' : 'Where to start'}</p>
      ${nothingBelow ? `<p>You got every question we asked. Everything this
        rests on held up, so there is no gap lower down to go back for &mdash;
        the method itself is the thing to work on:</p>` : ''}
      ${guess ? `<p>We didn&rsquo;t get far enough to be sure what sits under
        this one. Of what you did answer, though, this is the first thing that
        gave way &mdash; so it is the place to start:</p>` : ''}
      <p class="gap">${named ? escape(named.skill) : 'We couldn&rsquo;t pin this one down'}</p>
      <!-- What they got right, first. It is true, it comes straight off the
           answers, and it changes the sentence entirely: "you did the
           differentiation fine, it was the bracket" is heard, and "you cannot
           expand brackets" is not. Only when there is something to say - a
           student who got nothing right must not be told they did. -->
      ${gap && heldUp.length ? `<p class="held-up">You got
        ${listOf(heldUp.map(escape))} right. It&rsquo;s this one underneath
        that&rsquo;s getting in the way.</p>` : ''}
      <!-- The order here is the whole point of this screen, and it is not the
           order the explanation is stored in.

           A student who has just been told they are missing something does not
           need a correct definition first. They need the moment where the name
           stops being a label and starts meaning something - so "plain" leads,
           in words with no maths in them, then "like" puts it next to
           something that happens in real life, then the picture, and only then
           the accurate version and the worked case.

           Told the other way round, which is how it read before, the first
           sentence a struggling student meets is the one written for somebody
           who already knows. -->
      <!-- The offer comes before the reading, not after it. A student who
           has just been told what they are missing wants to be taken through
           it; the explanation underneath is for whoever would rather read. -->
      <p class="teach">
        <button onclick="startLesson()">Take me through it</button>
        <span class="note">A step at a time, then back to your own question.
        You do the working.</span>
      </p>

      ${named && named.explanation && named.explanation.plain
        ? `<p class="plain-said">${mathHtml(named.explanation.plain)}</p>` : ''}
      ${named && named.explanation && named.explanation.like
        ? `<p class="like"><span class="like-tag">Think of it like this</span>
           ${mathHtml(named.explanation.like)}</p>` : ''}
      ${named && named.visual
        ? `<figure class="visual">${named.visual}</figure>` : ''}
      ${named && named.explanation ? `
        <!-- "what" is the accurate sentence, and on a skill whose plain line
             is already accurate the two say the same thing twice - which is
             how a page stops being read. So when the plain line is there,
             this becomes something you can open rather than something you
             have to get past, and the story runs straight from the meaning to
             a worked case. When it is not there, it is the only explanation
             on the screen and stays where it was. -->
        ${named.explanation.plain
          ? `<details class="precise">
               <summary>Say that more precisely</summary>
               <p>${mathHtml(named.explanation.what)}</p>
             </details>`
          : `<p>${mathHtml(named.explanation.what)}</p>`}
        ${named.explanation.plain ? '<p class="label">Here it is with numbers</p>' : ''}
        <p class="worked">${mathHtml(named.explanation.example)}</p>
        <p class="label">What usually goes wrong</p>
        <p class="slip">${mathHtml(named.explanation.wrong)}</p>` : ''}
      ${named && named.practice
        ? `<p class="practice">${mathHtml(named.practice)}</p>` : ''}
      ${how}
    </div>


    ${why && !nothingBelow ? `<div class="card">
      <p class="label">Why we stopped here</p>
      ${why}
    </div>` : ''}

    ${wayBack(gap, r.stuck_on)}

    ${canRetake() ? `<div class="card">
      <p class="label">When you&rsquo;ve worked on it</p>
      <p>${nothingBelow
        ? `Come back and run this again once you have worked on the method. The
           questions underneath are drawn fresh each time, so it is a real
           re-check rather than the same three.`
        : `Come back and run this same question again. It starts from scratch and
           asks fresh questions, so if ${named ? escape(named.skill) : 'this'}
           holds by then, it carries on past it and looks for whatever is behind
           it.`}</p>
      <p><button onclick="retake()">Try this question again</button></p>
    </div>` : ''}

    <details class="card">
      <summary>Every question you answered</summary>
      <ul>${r.asked.map(a =>
        `<li class="${a.held ? 'held' : 'missed'}">${escape(a.skill)}
          &mdash; ${a.held ? 'you got this'
                   : (a.dont_know ? 'you weren&rsquo;t sure' : 'not quite')}
         ${a.mistake ? `<br><span class="note">${escape(a.mistake)}</span>` : ''}</li>`
      ).join('')}</ul>
    </details>

    ${usefulCard()}
    ${verdictCard()}

    <p><button class="plain" onclick="newQuestion()">A different question</button></p>`;

  wireParts();
  wireUseful();
  if (isTutor()) wireVerdict();
}

// One tap, from whoever this was for. A different question from whether the
// diagnosis was correct - a right answer can still be no use, and a wrong one
// can still be worth the ten minutes - and the only one everybody can answer
// without thinking about it.
function usefulCard() {
  return `<div class="card useful" id="useful">
    <p class="note">Did this help?</p>
    <p>
      <button class="plain" data-useful="yes">Yes</button>
      <button class="plain" data-useful="no">Not really</button>
    </p>
    <p id="useful-said" class="note" role="status" aria-live="polite"></p>
  </div>`;
}

function wireUseful() {
  const said = document.getElementById('useful-said');
  document.querySelectorAll('#useful button').forEach(button => {
    button.onclick = async () => {
      document.querySelectorAll('#useful button').forEach(b => b.disabled = true);
      try {
        const reply = await post('/api/rating', {
          session_id: state.session_id,
          useful: button.dataset.useful === 'yes',
        });
        said.textContent = reply.message;
      } catch (error) {
        document.querySelectorAll('#useful button').forEach(b => b.disabled = false);
        said.className = 'error';
        said.textContent = error.message;
      }
    };
  });
}

// The only signal that can correct the graph. Everything else we record says
// how the walk behaved, not whether it was right.
function verdictCard() {
  if (!isTutor()) return '';
  // The note sits above the buttons rather than inside the correction, so it
  // can be left on either verdict. "Right, but it took nine questions" is worth
  // as much as a correction, and it had nowhere to go when the box only
  // appeared for people who disagreed.
  return `<div class="card" id="verdict">
    <p class="label">Was this right?</p>
    <label for="verdict-note">Anything worth knowing (optional)</label>
    <textarea id="verdict-note" placeholder="Right skill, but they got there by guessing."></textarea>
    <p>
      <button id="was-right">Yes, that was the gap</button>
      <button id="was-wrong">No</button>
    </p>
    <div id="correction" hidden>
      <label for="real-gap">What was it really?</label>
      <input type="text" id="real-gap" placeholder="Expanding brackets">
      <p><button id="send-verdict">Save</button></p>
    </div>
    <p id="verdict-msg" class="note"></p>
  </div>`;
}

function wireVerdict() {
  const msg = document.getElementById('verdict-msg');
  const correction = document.getElementById('correction');

  document.getElementById('was-right').onclick = () => sendVerdict('right');
  document.getElementById('was-wrong').onclick = () => {
    correction.hidden = false;
    document.getElementById('real-gap').focus();
  };
  document.getElementById('send-verdict').onclick = () => sendVerdict('wrong');

  async function sendVerdict(verdict) {
    const body = {session_id: state.session_id, verdict};
    body.note = document.getElementById('verdict-note').value.trim() || null;
    if (verdict === 'wrong') {
      body.actual_gap = document.getElementById('real-gap').value.trim() || null;
    }
    try {
      const saved = await post('/api/feedback', body);
      correction.hidden = true;
      document.querySelectorAll('#verdict button').forEach(b => b.disabled = true);
      msg.textContent = saved.actual_gap && !saved.matched_a_known_skill
        ? `Saved. "${saved.actual_gap}" is not a skill on the map, which is worth knowing.`
        : 'Saved.';
    } catch (error) {
      msg.className = 'error';
      msg.textContent = error.message;
    }
  }
}

function listOf(items) {
  if (items.length === 0) return '';
  if (items.length === 1) return items[0];
  return items.slice(0, -1).join(', ') + ' and ' + items[items.length - 1];
}

function outOfScope() {
  screen.innerHTML = `
    <div class="card">
      <p style="white-space: pre-wrap">${escape(state.message)}</p>
    </div>
    <p><button onclick="askScreen()">Try another question</button></p>`;
}

async function get(path) {
  const response = await fetch(path);
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || 'Something went wrong.');
  return data;
}

async function post(path, body) {
  const response = await fetch(path, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  });
  const data = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(data.detail || 'Something went wrong.');
  return data;
}

// The longest edge a photo needs to be for the maths on it to be readable.
// A phone camera produces four times this, which is four megabytes of detail
// nobody looks at - and base64 adds a third again on top, all of it uploaded
// before the question has even been read.
const LONGEST_EDGE = 1800;

// Kept high on purpose. This is a picture of small handwriting and thin
// fraction bars, and compression artefacts land exactly on the strokes that
// tell a 3 from an 8.
const QUALITY = 0.9;

// Shrink an image before it goes anywhere. PDFs are passed through untouched -
// they cannot be resized here, and their text is already sharp at any size.
async function readyToSend(file) {
  if (!file.type.startsWith('image/')) return file;

  try {
    const bitmap = await createImageBitmap(file);
    const scale = Math.min(1, LONGEST_EDGE / Math.max(bitmap.width, bitmap.height));
    if (scale === 1) return file;

    const canvas = document.createElement('canvas');
    canvas.width = Math.round(bitmap.width * scale);
    canvas.height = Math.round(bitmap.height * scale);
    canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);

    const smaller = await new Promise(done =>
      canvas.toBlob(done, 'image/jpeg', QUALITY));

    // If shrinking somehow made it bigger, keep what we had.
    if (!smaller || smaller.size >= file.size) return file;
    return new File([smaller], 'photo.jpg', {type: 'image/jpeg'});
  } catch (error) {
    // An old browser, or an image it cannot decode. Sending the original is
    // slower but it still works, and that matters more than it being small.
    return file;
  }
}

function asBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---- Maths -------------------------------------------------------------
//
// The bank stores maths the way a person types it - x^(-2), sqrt(136),
// (4x^2 + 3x)/(x - 2) - because that is what the model writes and what the
// audit compares. KaTeX needs LaTeX. So the notation is converted here, at the
// moment it is shown, rather than being stored twice.
//
// Questions are prose with maths in them, not maths, so this cannot simply
// typeset the whole string. It finds the runs that are actually notation and
// leaves the sentence alone.

// Written in plain ES5 - no arrow functions, no flatMap - so it runs in a
// bare JavaScript engine as well as a browser. That is what lets the tests
// exercise this exact code rather than a Python rewrite of it.

// Words that are maths even though they are only letters.
var FUNCTIONS = ['sqrt', 'sin', 'cos', 'tan', 'ln', 'log', 'pi', 'lim'];

// A token can join a maths run if it is notation rather than a word: it has a
// digit, or an operator, or it is a single letter being used as a variable.
// Two-letter words like "of" and "to" are how a run would otherwise swallow
// the sentence around it.
function canJoin(token) {
  if (!token) return false;
  if (FUNCTIONS.indexOf(token.toLowerCase()) !== -1) return true;
  if (/\d/.test(token)) return true;
  if (/[\^_+\-*\/=()\[\]<>|]/.test(token)) return true;
  // dx, dy, dt - the differential in an integral. Two letters, no operator,
  // so nothing else here would let them into a run, and they sit in the
  // middle of one: "sin(x) / cos(x) dx".
  if (/^d[a-z]$/.test(token)) return true;
  return /^[A-Za-z]$/.test(token);
}

// Only runs containing one of these are worth typesetting. Without it,
// "(3 - x)(2 + 5x)" would be re-rendered for no gain, and every re-render is
// a chance to make something worse.
//
// sqrt is matched without a word boundary because 4sqrt(3) is how coefficients
// come out of the bank, and \bsqrt\b misses it - which looked far worse than
// doing nothing, because sqrt(12) in the same sentence did typeset.
//
// Any slash inside a run counts. Requiring non-space either side missed
// "sin(x) / cos(x)", which is exactly the shape a quotient arrives in.
function worthIt(run) {
  return /[\^_]/.test(run) || /sqrt/.test(run) || run.indexOf('/') !== -1;
}

// a/b -> \frac{a}{b}, innermost first, brackets respected.
function fractions(text) {
// An operand may also drag a bracketed group behind it, which is what a
// negative or compound exponent looks like before the exponent rule has run:
// x^(-n), x^(2n), f(x). Without the optional group the alternation matched
// only the bare part, so 1 / x^(-n) came out as \frac{1}{x^}(-n) - an empty
// superscript, which KaTeX refuses, and the (-n) left stranded outside the
// fraction. A student was shown that as red source on an index-laws question.
  var operand = '(\\([^()]*(?:\\([^()]*\\)[^()]*)*\\)|[A-Za-z0-9{}^_\\\\]+(?:\\([^()]*\\))?)';
  var pattern = new RegExp(operand + '\\s*\\/\\s*' + operand);
  function bare(x) { return /^\(.*\)$/.test(x) ? x.slice(1, -1) : x; }
  var before;
  do {
    before = text;
    text = text.replace(pattern, function (whole, top, bottom) {
      return '\\frac{' + bare(top) + '}{' + bare(bottom) + '}';
    });
  } while (text !== before);
  return text;
}

function toLatex(run) {
  var out = run;
  out = out.replace(/sqrt\s*\(([^()]*(?:\([^()]*\)[^()]*)*)\)/g, '\\sqrt{$1}');
  // Not \b at the end: log_3 and sin^2 are both common, and a word boundary
  // fails on both because _ and ^ are not letters. The lookahead keeps it from
  // firing inside a longer word.
  out = out.replace(/\b(sin|cos|tan|ln|log)(?![a-z])(\s*\()?/g, function (whole, fn, opened) {
    return '\\' + fn + (opened ? '(' : ' ');
  });
  // The trailing space is what separates a command from a bare argument:
  // \sin x, never \sinx. A bracket separates it just as well, and keeping
  // the two together is what lets the fraction rule treat sin(x) as one
  // operand - without it, sin(x) / cos(x) came out as \sin \frac{x}{\cos} (x),
  // which KaTeX prints in red.
  out = out.replace(/\bpi\b/g, '\\pi ');
  // Fractions first, and the order is the bug this had.
  //
  // An operand may contain braces, because a fraction can sit over something
  // already converted. So if exponents run first, x^(1/2) has become x^{1/2}
  // by the time fractions sees it - and then the numerator matches x^{1 and
  // the denominator matches 2}, giving rac{x^{1}{2}}. KaTeX prints that in
  // red and swallows whatever follows into the denominator, which is how an
  // equals sign ended up underneath a fraction on a student's screen.
  //
  // Run first, the division inside the brackets is turned into rac{1}{2}
  // while the brackets are still brackets, and the exponent rule wraps the
  // finished thing.
  out = fractions(out);

  // Exponents and subscripts, bracketed or bare. Bare has to be braced too, or
  // x^12 typesets as x^1 followed by a 2.
  //
  // A bare one is a run of digits or a single letter, and never a mixture.
  // [A-Za-z0-9]+ was greedy across both, so x^2y^3 - which is how the bank
  // writes a binomial term - had its exponent read as 2y, leaving x^{2y}^{3}.
  // That is a double superscript, which KaTeX refuses and prints in red, so
  // the coefficient a student was being asked about arrived as raw source.
  // Anything genuinely multi-character goes in brackets: x^(2n), not x^2n.
  out = out.replace(/\^\s*\(([^()]*)\)/g, '^{$1}');
  // A decimal counts as one number: x^1.75 was braced as x^{1} with a loose
  // .75 after it, which reads as x to the first times nought point seven
  // five. The digits after the point are only swallowed when they are there,
  // so a power at the end of a sentence - "simplify x^2." - keeps its stop.
  out = out.replace(/\^\s*(-?\d+(?:\.\d+)?|-?[A-Za-z])/g, '^{$1}');
  out = out.replace(/_\s*\(([^()]*)\)/g, '_{$1}');
  out = out.replace(/_\s*(-?\d+(?:\.\d+)?|-?[A-Za-z])/g, '_{$1}');
  // A bare underscore left after those two is not a subscript - it is a
  // blank, which is how the gap in "3 + 4 = _ + 5" is written, and that
  // is exactly the question that exposes what a student thinks the equals
  // sign means. KaTeX refuses a subscript with nothing under it, so it
  // gets escaped into the underscore it was always meant to be.
  out = out.replace(/_(?!\{)/g, '\\_');
  out = out.replace(/\*/g, ' \\cdot ');
  out = out.replace(/<=/g, ' \\le ').replace(/>=/g, ' \\ge ');
  out = out.replace(/!=/g, ' \\ne ');
  // Whatever angle brackets are left are inequalities, and LaTeX has words for
  // those. Turning them into relations here means no run can carry a tag as
  // far as the renderer: a question containing a closing script tag arrives
  // with a slash in it, which is enough to make it look like a fraction and
  // get typeset. KaTeX escapes its own output, but nothing student-facing
  // should rest on that being true of whichever version is on the CDN.
  //
  // That tag is described rather than written here on purpose. The HTML parser
