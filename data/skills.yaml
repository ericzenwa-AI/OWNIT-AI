# A-level maths skill graph.
#
# The v2 diagnostic walks this graph downward: it starts at the skill the exam
# question is asking for and follows `needs` until it finds a node the student
# cannot actually do. That node is the thing to teach.

meta:
  # Topics are not listed here - they are read off the skills that carry one,
  # so the list cannot drift out of date. See graph.topics().
  syllabus: A-level (UK), spec-agnostic
  version: 0.1-draft
  status: hypothesis — not validated against student data

  schema:
    id: stable snake_case key, used in needs
    name: human-readable name
    level: 0 = what an exam question asks for, 4 = assumed floor
    topic: >-
      optional - the kind of question this is (differentiation, integration,
      trigonometry). Present ONLY on skills a paper can actually ask for, and
      having one is what makes a skill an entry point. Shared skills such as
      index laws sit underneath several topics and belong to none of them, so
      they carry no topic at all. To list a topic's content, walk down from its
      entry points instead - a derived answer cannot drift out of date.
    kind: procedure (a thing they DO) | fact (a thing they RECALL) | concept (a thing they UNDERSTAND)
    probe: what a question testing THIS node alone must require. Feed this to the question generator.
    needs: ids of nodes that must be in place first
    note: optional — observed evidence or a warning about this node

  notes:
    - Level is a hint for batching, not a strict hierarchy. Follow needs, not level numbers.
    - "kind matters: 'fact' nodes need recall questions, 'concept' nodes need explain-or-choose questions, 'procedure' nodes need do-it questions. Generating the same question shape for all three is the fastest way to make this useless."
    - Nodes with many dependents are load-bearing but usually intact. Use as a tiebreaker, not a starting point.
    - Floor nodes (level 4) recur across every A-level topic. Build them once, reuse across trigonometry, integration, series.

nodes:

  # ---- Level 0: what an exam question actually asks for --------------------

  - id: differentiate_function
    name: Differentiate a given function
    level: 0
    topic: differentiation
    kind: procedure
    probe: Differentiate an expression requiring at least one named rule.
    needs: [power_rule, chain_rule, product_rule, quotient_rule, deriv_sin_cos, deriv_exp_e, deriv_ln, simplify_derivative]

  - id: gradient_at_point
    name: Find the gradient at a point
    level: 0
    topic: differentiation
    kind: procedure
    probe: Differentiate, then evaluate the derivative at a given x.
    needs: [differentiate_function, substitute_expr, derivative_meaning]

  - id: tangent_equation
    name: Equation of a tangent
    level: 0
    topic: differentiation
    kind: procedure
    probe: Find the tangent to a curve at a stated point, answer in exact form.
    needs: [gradient_at_point, straight_line_equation, exact_form]

  - id: normal_equation
    name: Equation of a normal
    level: 0
    topic: differentiation
    kind: procedure
    probe: Find the normal at a point — requires flipping and negating the tangent gradient.
    needs: [tangent_equation, perpendicular_gradients]

  - id: find_stationary_points
    name: Find stationary points
    level: 0
    topic: differentiation
    kind: procedure
    probe: Set the derivative to zero and solve for all x, then find the y-coordinates.
    needs: [differentiate_function, stationary_definition, solve_quadratic, factorise_common, exp_never_zero]

  - id: classify_stationary
    name: Classify stationary points
    level: 0
    topic: differentiation
    kind: procedure
    probe: Decide max or min for each stationary point and state the reasoning.
    needs: [find_stationary_points, second_derivative, gradient_sign]

  - id: increasing_decreasing
    name: Increasing and decreasing intervals
    level: 0
    topic: differentiation
    kind: procedure
    probe: State the range of x for which a function is increasing.
    needs: [differentiate_function, gradient_sign, solve_quadratic]

  - id: optimisation
    name: Optimisation in context
    level: 0
    topic: differentiation
    kind: procedure
    probe: Given a worded or geometric situation, build the function, optimise it, and interpret the answer.
    needs: [form_expression_from_context, find_stationary_points, classify_stationary]

  - id: connected_rates
    name: Connected rates of change
    level: 0
    topic: differentiation
    kind: procedure
    probe: Chain two rates together to find a third, e.g. dV/dt from dV/dr and dr/dt.
    needs: [chain_rule, differentiate_function, form_expression_from_context]

  - id: implicit_diff
    name: Implicit differentiation
    level: 0
    topic: differentiation
    kind: procedure
    probe: Differentiate an equation not written as y = f(x), and rearrange for dy/dx.
    needs: [chain_rule, product_rule, algebraic_fractions]

  - id: parametric_diff
    name: Parametric differentiation
    level: 0
    topic: differentiation
    kind: procedure
    probe: Find dy/dx from x and y both given in terms of a parameter.
    needs: [chain_rule, differentiate_function, algebraic_fractions]

  # ---- Level 1: the named rules --------------------------------------------

  - id: power_rule
    name: Power rule
    level: 1
    kind: procedure
    probe: Differentiate a sum of powers including a negative and a fractional index.
    needs: [deriv_polynomial, rewrite_index_form]

  - id: chain_rule
    name: Chain rule
    level: 1
    kind: procedure
    probe: Differentiate a function of a function, e.g. a bracket raised to a power.
    needs: [recognise_composite, deriv_polynomial]

  - id: product_rule
    name: Product rule
    level: 1
    kind: procedure
    probe: Differentiate two functions multiplied together.
    needs: [recognise_product, deriv_polynomial]

  - id: quotient_rule
    name: Quotient rule
    level: 1
    kind: procedure
    probe: Differentiate one function divided by another, and simplify the result.
    needs: [recognise_quotient, product_rule, algebraic_fractions]

  - id: first_principles
    name: Differentiation from first principles
    level: 1
    topic: differentiation
    kind: procedure
    probe: Derive the derivative of a simple function using the limit definition.
    needs: [limit_h_to_zero, expand_brackets, algebraic_fractions]

  - id: second_derivative
    name: Second derivative
    level: 1
    kind: procedure
    probe: Differentiate a derivative again and state what its sign tells you.
    needs: [differentiate_function, gradient_sign]

  # ---- Level 2: recognition, standard results, and getting to a usable form -

  - id: recognise_composite
    name: Spot a function inside a function
    level: 2
    kind: concept
    probe: Given several expressions, pick the ones that are composite and name the inner function.
    needs: [function_notation]

  - id: recognise_product
    name: Spot a product
    level: 2
    kind: concept
    probe: Given several expressions, identify which need the product rule and state u and v.
    needs: [function_notation]

  - id: recognise_quotient
    name: Spot a quotient
    level: 2
    kind: concept
    probe: Decide whether an expression is better handled as a quotient or rewritten as a product.
    needs: [function_notation, algebraic_fractions]

  - id: deriv_polynomial
    name: Derivative of x to the n
    level: 2
    kind: fact
    probe: State the derivative of x to a given power, including negative and fractional.
    needs: [index_laws, index_notation]

  - id: deriv_sin_cos
    name: Derivatives of sin and cos
    level: 2
    kind: fact
    probe: State the derivatives of sin x and cos x, and note the radians requirement.
    needs: [radians]

  - id: deriv_tan
    name: Derivative of tan
    level: 2
    kind: fact
    probe: State the derivative of tan x.
    needs: [deriv_sin_cos]

  - id: deriv_exp_e
    name: Derivative of e to the x
    level: 2
    kind: fact
    probe: State the derivative of e to the x and of e to the kx.
    needs: [exponential_graph]

  - id: deriv_ln
    name: Derivative of ln x
    level: 2
    kind: fact
    probe: State the derivative of ln x.
    needs: [log_laws]

  - id: deriv_a_to_x
    name: Derivative of a to the x
    level: 2
    kind: fact
    probe: Differentiate an exponential with a base other than e.
    needs: [deriv_exp_e, log_laws]
    note: "AQA Nov 2020 Q14b(i): a significant number of students did not know this."

  - id: simplify_derivative
    name: Tidy a derivative
    level: 2
    kind: procedure
    probe: Take an unsimplified derivative and factorise it into a usable form.
    needs: [factorise_common, algebraic_fractions]

  - id: limit_h_to_zero
    name: Limit as h approaches zero
    level: 2
    kind: concept
    probe: Explain what happens to a chord's gradient as the second point moves toward the first.
    needs: [chord_vs_tangent]

  - id: recognise_index_form
    name: Spot that an expression needs rewriting as powers
    level: 2
    kind: concept
    probe: Given several expressions, pick the ones that must be converted to index form before anything else can be done, and say why.
    needs: [index_laws, surds]
    note: "Hypothesis, added 2026-08-15 - not yet seen in a student. Mirrors recognise_product and recognise_composite: holding a rule and knowing when to reach for it are separate. Delete this if no student ever fails here while passing index_laws."

  - id: rewrite_index_form
    name: Rewrite in index form
    level: 2
    kind: procedure
    probe: Turn roots and fractions such as a square root, or 3 over x squared, into powers of x.
    needs: [recognise_index_form, index_laws, surds, algebraic_fractions]
    note: "Very common hidden blocker — students who 'can't differentiate' often can't get the expression into a differentiable form."

  - id: form_expression_from_context
    name: Build a function from a situation
    level: 2
    kind: procedure
    probe: Turn a worded or geometric setup into a single-variable expression, eliminating the other variable.
    needs: [substitute_expr, expand_brackets, solve_linear]

  # ---- Level 3: the algebra and meaning underneath --------------------------

  - id: index_laws
    name: Laws of indices
    level: 3
    kind: fact
    probe: Simplify expressions using negative, fractional and zero powers.
    needs: [index_notation, fractions_arith, negatives]
    note: "AQA Nov 2020 Q5: students treated 3 to the power 0 as 3."

  - id: surds
    name: Surds
    level: 3
    kind: procedure
    probe: Convert between root form and index form and simplify.
    needs: [index_laws]

  - id: algebraic_fractions
    name: Algebraic fractions
    level: 3
    kind: procedure
    probe: Simplify, combine or split a fraction with algebra in the numerator or denominator.
    needs: [fractions_arith, factorise_common]

  - id: function_notation
    name: Function notation
    level: 3
    kind: concept
    probe: Interpret f(x), f'(x) and dy/dx, and say what each represents.
    needs: [substitute_expr]

  - id: derivative_meaning
    name: What a derivative is
    level: 3
    kind: concept
    probe: Explain in words what dy/dx tells you about a curve at a point.
    needs: [gradient_straight_line]
    note: If this is missing, everything above it is being done by rote. Test it early.

  - id: chord_vs_tangent
    name: Chord versus tangent
    level: 3
    kind: concept
    probe: Distinguish average gradient between two points from gradient at a single point.
    needs: [gradient_straight_line, derivative_meaning]

  - id: stationary_definition
    name: What stationary means
    level: 3
    kind: concept
    probe: State the condition for a stationary point without being told to differentiate.
    needs: [derivative_meaning]

  - id: gradient_sign
    name: Sign of the gradient
    level: 3
    kind: concept
    probe: Given the sign of a derivative, say whether the function rises or falls.
    needs: [derivative_meaning, negatives]

  - id: radians
    name: Radians
    level: 3
    kind: fact
    probe: Convert between degrees and radians and recognise when radians are required.
    needs: [fractions_arith]

  - id: exponential_graph
    name: Shape of an exponential graph
    level: 3
    kind: concept
    probe: Describe the shape and behaviour of y equals a to the x.
    needs: [index_laws]

  - id: exp_never_zero
    name: An exponential is never zero
    level: 3
    kind: fact
    probe: Given a factorised derivative containing an exponential factor, say which factor can be discarded and why.
    needs: [exponential_graph]
    note: Pure fact node. Invisible in a procedural breakdown, but it is where students lose solutions.

  - id: log_laws
    name: Laws of logarithms
    level: 3
    kind: fact
    probe: Apply the product, quotient and power laws, and reject log of a sum as a sum of logs.
    needs: [index_laws]

  - id: exact_form
    name: Exact form
    level: 3
    kind: concept
    probe: Recognise when an answer must be left as a surd, fraction, or in terms of e, rather than rounded.
    needs: [surds, fractions_arith]

  # ---- Level 4: the assumed floor ------------------------------------------

  - id: negatives
    name: Negative number arithmetic
    level: 4
    kind: procedure
    probe: Add, subtract and multiply with negatives, including double negatives.
    needs: []

  - id: fractions_arith
    name: Fraction arithmetic
    level: 4
    kind: procedure
    probe: Add, multiply and divide fractions.
    needs: []

  - id: bidmas
    name: Order of operations
    level: 4
    kind: procedure
    probe: Evaluate an expression where order changes the answer.
    needs: []

  - id: index_notation
    name: Index notation
    level: 4
    kind: fact
    probe: Read and write powers, and evaluate small ones.
    needs: []

  - id: substitute_expr
    name: Substitution
    level: 4
    kind: procedure
    probe: Put a number, including a negative, into an algebraic expression.
    needs: [bidmas, negatives]

  - id: coordinates
    name: Coordinates
    level: 4
    kind: procedure
    probe: Plot and read points on axes.
    needs: []

  - id: gradient_straight_line
    name: Gradient of a straight line
    level: 4
    kind: concept
    probe: Find the gradient between two points and say what it means.
    needs: [coordinates, fractions_arith]

  - id: expand_brackets
    name: Expanding brackets
    level: 4
    kind: procedure
    probe: Expand a product of two brackets.
    needs: [negatives]

  - id: solve_linear
    name: Solving linear equations
    level: 4
    kind: procedure
    probe: Rearrange and solve for x.
    needs: [negatives]

  - id: factorise_common
    name: Factorising a common factor
    level: 4
    kind: procedure
    probe: Take the highest common factor out of an expression, including one with powers.
    needs: [index_notation, expand_brackets]

  - id: factorise_quadratic
    name: Factorising a quadratic
    level: 4
    kind: procedure
    probe: Factorise a quadratic into two brackets.
    needs: [expand_brackets]

  - id: null_factor
    name: Product equals zero
    level: 4
    kind: fact
    probe: Given a product equal to zero, state what follows.
    needs: []

  # Both a doorway and a prerequisite. A paper asks this directly, and finding
  # stationary points rests on it. Entry points are not a flat layer, which is
  # why a topic marks them rather than a level number.
  - id: solve_quadratic
    name: Solving quadratics
    level: 4
    topic: quadratics
    kind: procedure
    probe: Solve a quadratic and give both roots.
    needs: [factorise_quadratic, null_factor]

  - id: straight_line_equation
    name: Equation of a straight line
    level: 4
    kind: procedure
    probe: Write the line through a given point with a given gradient.
    needs: [gradient_straight_line, substitute_expr]

  - id: perpendicular_gradients
    name: Perpendicular gradients
    level: 4
    kind: fact
    probe: Given a gradient, state the gradient perpendicular to it.
    needs: [gradient_straight_line, fractions_arith]

  # ---- Doorways onto the shared floor --------------------------------------
  #
  # Everything below is an entry point for a topic other than differentiation.
  # Almost none of it needs new foundations: the levels 2-4 skills above are
  # shared, so a topic costs a handful of doorways rather than a subtree.
  # Added 2026-08-16, prerequisite links to be checked against real students.

  # ---- Indices and surds ---------------------------------------------------

  - id: equate_indices
    name: Compare indices on the same base
    level: 2
    kind: concept
    probe: Given an equation with the unknown in the index, say what has to be true of both sides before the indices can be compared, and why.
    needs: [index_laws, exponential_graph]
    note: "Missing from the graph until a real student hit it. AQA-style: 1152 x (1/2)^x = 9 needs 9/1152 rewritten as (1/2)^7 before x can be read off."

  - id: simplify_index_expression
    name: Simplify an expression with roots and powers
    level: 0
    topic: indices and surds
    kind: procedure
    probe: Turn an expression containing roots, fractions and powers into a single simplified index form.
    needs: [rewrite_index_form, index_laws, algebraic_fractions]

  - id: evaluate_index
    name: Evaluate a negative, fractional or zero power
    level: 0
    topic: indices and surds
    kind: procedure
    probe: Work out the value of a number raised to a negative, fractional or zero index.
    needs: [index_laws, fractions_arith, negatives]

  - id: solve_index_equation
    name: Solve an equation with the unknown in the index
    level: 0
    topic: indices and surds
    kind: procedure
    probe: Solve for x when x appears in the index, by writing both sides to the same base.
    needs: [equate_indices, index_laws, solve_linear]

  - id: rationalise_denominator
    name: Clear a surd from a denominator
    level: 0
    topic: indices and surds
    kind: procedure
    probe: Rewrite a fraction so that no surd is left in the denominator.
    needs: [surds, algebraic_fractions, expand_brackets]

  # ---- Exponentials and logarithms -----------------------------------------

  - id: solve_exponential_equation
    name: Solve an exponential equation with logs
    level: 0
    topic: exponentials and logarithms
    kind: procedure
    probe: Solve an equation with the unknown in the index where the two sides cannot be written to the same base, so logarithms are needed.
    needs: [log_laws, exponential_graph, solve_linear]

  - id: solve_log_equation
    name: Solve an equation containing logarithms
    level: 0
    topic: exponentials and logarithms
    kind: procedure
    probe: Solve for x in an equation where x sits inside a logarithm.
    needs: [log_laws, index_laws, solve_linear]

  - id: simplify_logs
    name: Combine or split logarithms
    level: 0
    topic: exponentials and logarithms
    kind: procedure
    probe: Write several logarithms as a single logarithm, or break one into parts.
    needs: [log_laws, index_laws]

  # ---- Quadratics ----------------------------------------------------------
  # solve_quadratic above is the third doorway here - it was already in the
  # graph as a prerequisite and only needed a topic.

  - id: complete_the_square
    name: Completing the square
    level: 0
    topic: quadratics
    kind: procedure
    probe: Write a quadratic in completed-square form and read off the turning point.
    needs: [expand_brackets, factorise_common, fractions_arith, negatives]

  - id: use_discriminant
    name: Using the discriminant
    level: 0
    topic: quadratics
    kind: procedure
    probe: Work out b^2 - 4ac for a quadratic and say how many real roots it has.
    needs: [substitute_expr, negatives, index_notation]

  # ---- Coordinate geometry -------------------------------------------------

  - id: line_through_two_points
    name: Equation of a line through two points
    level: 0
    topic: coordinate geometry
    kind: procedure
    probe: Find the equation of the straight line passing through two given points.
    needs: [gradient_straight_line, straight_line_equation, fractions_arith]

  - id: perpendicular_line
    name: Equation of a perpendicular line
    level: 0
    topic: coordinate geometry
    kind: procedure
    probe: Find the equation of the line perpendicular to a given line through a stated point.
    needs: [perpendicular_gradients, straight_line_equation, gradient_straight_line]

  - id: midpoint_and_distance
    name: Midpoint and distance between two points
    level: 0
    topic: coordinate geometry
    kind: procedure
    probe: Find the midpoint of two points and the distance between them, leaving the distance in exact form.
    needs: [coordinates, substitute_expr, surds, fractions_arith]

  # ---- Integration ---------------------------------------------------------
  # Nearly all of its floor already exists, built for differentiation: the
  # standard derivatives, index laws, and rewriting into index form.

  - id: integral_meaning
    name: What integration undoes
    level: 3
    kind: concept
    probe: Explain what an integral gives you, and why differentiating the answer returns the original.
    needs: [derivative_meaning]

  - id: constant_of_integration
    name: Why an indefinite integral needs + c
    level: 3
    kind: concept
    probe: Say why an indefinite integral carries an arbitrary constant, and when it can be pinned down.
    needs: [integral_meaning]

  - id: integrate_powers
    name: Integrate a power of x
    level: 2
    kind: procedure
    probe: Raise the index by one and divide by the new index, including negative and fractional powers.
    needs: [deriv_polynomial, index_laws, rewrite_index_form]

  - id: standard_integrals
    name: Standard integrals
    level: 2
    kind: fact
    probe: State the integrals of e^x, 1/x, sin x and cos x.
    needs: [deriv_exp_e, deriv_ln, deriv_sin_cos]

  - id: recognise_reverse_chain
    name: Spot an integral that needs a substitution
    level: 2
    kind: concept
    probe: Given several integrals, pick the ones needing a substitution and name what to substitute.
    needs: [recognise_composite, chain_rule]

  - id: definite_integral
    name: Evaluate an integral between limits
    level: 1
    kind: procedure
    probe: Integrate, substitute both limits, and subtract in the right order.
    needs: [integrate_powers, substitute_expr, negatives]

  - id: integrate_expression
    name: Integrate an expression
    level: 0
    topic: integration
    kind: procedure
    probe: Integrate an expression in powers of x, giving the answer with a constant.
    needs: [integrate_powers, constant_of_integration, rewrite_index_form]

  - id: evaluate_definite_integral
    name: Work out a definite integral
    level: 0
    topic: integration
    kind: procedure
    probe: Evaluate an integral between two limits, leaving the answer in exact form.
    needs: [definite_integral, exact_form]

  - id: area_under_curve
    name: Find the area under a curve
    level: 0
    topic: integration
    kind: procedure
    probe: Set up and evaluate the integral giving the area between a curve and the x-axis.
    needs: [definite_integral, integral_meaning, coordinates]

  - id: integrate_by_substitution
    name: Integrate by substitution
    level: 0
    topic: integration
    kind: procedure
    probe: Choose a substitution, change the variable and the limits, and integrate.
    needs: [recognise_reverse_chain, standard_integrals, definite_integral]

  - id: area_between_curves
    name: Find the area between two curves
    level: 0
    topic: integration
    kind: procedure
    probe: Find where two curves meet, then integrate the difference between them.
    needs: [definite_integral, solve_quadratic]

  # ---- Functions -----------------------------------------------------------

  - id: modulus_meaning
    name: What the modulus of a number is
    level: 3
    kind: concept
    probe: Say what the modulus of x means, and why it leaves a positive value alone.
    needs: [negatives]

  - id: domain_and_range
    name: Domain and range
    level: 3
    kind: concept
    probe: Say which values a function can take in, and which values it can give out.
    needs: [function_notation, coordinates]

  - id: compose_functions
    name: Put one function inside another
    level: 2
    kind: procedure
    probe: Work out fg(x) by substituting one function into the other, in the right order.
    needs: [function_notation, substitute_expr, recognise_composite]

  - id: inverse_function
    name: Find the inverse of a function
    level: 2
    kind: procedure
    probe: Swap x and y and rearrange to make y the subject.
    needs: [function_notation, solve_linear, algebraic_fractions]

  - id: modulus_graph
    name: Sketch a graph containing a modulus
    level: 2
    kind: procedure
    probe: Sketch the graph of a modulus function and read off the vertex.
    needs: [modulus_meaning, coordinates, straight_line_equation]

  - id: evaluate_composite
    name: Work out a composite function
    level: 0
    topic: functions
    kind: procedure
    probe: Evaluate fg(x) at a value, or write it as a single expression.
    needs: [compose_functions, substitute_expr]

  - id: find_inverse
    name: Find an inverse function
    level: 0
    topic: functions
    kind: procedure
    probe: Find the inverse of a function and state its domain.
    needs: [inverse_function, domain_and_range]

  - id: state_domain_range
    name: State a domain or range
    level: 0
    topic: functions
    kind: concept
    probe: Give the domain or range of a function, and say why values are excluded.
    needs: [domain_and_range]

  - id: sketch_modulus_graph
    name: Sketch a modulus graph
    level: 0
    topic: functions
    kind: procedure
    probe: Sketch a graph involving a modulus and give the coordinates of the vertex.
    needs: [modulus_graph, modulus_meaning]

  - id: solve_modulus_equation
    name: Solve an equation containing a modulus
    level: 0
    topic: functions
    kind: procedure
    probe: Solve a modulus equation by taking both branches and rejecting invalid solutions.
    needs: [modulus_meaning, solve_linear, solve_quadratic]

  # ---- Binomial expansion --------------------------------------------------

  - id: binomial_coefficients
    name: Binomial coefficients
    level: 2
    kind: fact
    probe: State how the coefficients of a binomial expansion are worked out.
    needs: [index_notation, fractions_arith]

  - id: binomial_validity
    name: When a binomial expansion is valid
    level: 2
    topic: binomial expansion
    kind: concept
    probe: Say for which values of x an expansion with a negative or fractional index is valid, and why.
    needs: [modulus_meaning, index_laws]

  - id: expand_binomial
    name: Expand a bracket to a positive whole power
    level: 0
    topic: binomial expansion
    kind: procedure
    probe: Expand a bracket raised to a positive whole number power, in ascending powers.
    needs: [binomial_coefficients, index_laws, expand_brackets]

  - id: expand_binomial_fractional
    name: Expand with a negative or fractional power
    level: 0
    topic: binomial expansion
    kind: procedure
    probe: Find the first few terms of an expansion where the index is negative or fractional.
    needs: [binomial_coefficients, index_laws, rewrite_index_form, fractions_arith]

  - id: binomial_approximation
    name: Use an expansion to approximate a value
    level: 0
    topic: binomial expansion
    kind: procedure
    probe: Substitute a value into an expansion to approximate a root, and say whether it is allowed.
    needs: [binomial_validity, binomial_coefficients, substitute_expr]

  # ---- Polynomials ---------------------------------------------------------

  - id: factor_theorem_meaning
    name: What the factor theorem says
    level: 3
    kind: concept
